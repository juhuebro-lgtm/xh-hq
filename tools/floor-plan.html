        <div class="fld"><label>類型</label><select class="inp" data-f="ot">${OPENS.map(o => `<option value="${o[0]}" ${o[0] === it.ot ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>
        <div class="fld"><label>開口寬度</label><span class="unit" data-u="cm"><input class="inp" type="number" min="20" data-f="w" value="${it.w}"></span></div>
        ${it.ot === 'door' || it.ot === 'door2' ? `<div class="btns" style="margin-bottom:8px">${it.ot === 'door' ? '<button class="btn sm" data-act="flip">↔ 換邊開</button>' : ''}<button class="btn sm" data-act="out">${it.out ? '改成往內開' : '改成往外開'}</button></div>` : ''}
        <p class="hint" style="margin-bottom:8px">拖拉會沿著牆移動，拖到別面牆會自動轉向。</p>
        ${acts}`;
    } else if (it.t === 'mark') {
      box.innerHTML = `
        <div class="fld"><label>孔位</label><select class="inp" data-f="mk">${MARKS.map(m => `<option value="${m[0]}" ${m[0] === it.mk ? 'selected' : ''}>${m[1]}</option>`).join('')}</select></div>
        <div class="fld"><label>備註（高度、規格）</label><input class="inp" data-f="note" value="${esc(it.note)}" placeholder="例：離地 110、220V 30A"></div>
        ${pos}${acts}`;
    } else if (it.t === 'text') {
      box.innerHTML = `
        <div class="fld"><label>文字</label><input class="inp" data-f="text" value="${esc(it.text)}"></div>
        <div class="row2"><div class="fld"><label>字的大小</label><span class="unit" data-u="cm"><input class="inp" type="number" min="5" data-f="fs" value="${it.fs}"></span></div>
        <div class="fld"><label>角度</label><span class="unit" data-u="°"><input class="inp" type="number" data-f="rot" value="${it.rot || 0}"></span></div></div>
        ${acts}`;
    } else if (it.t === 'dim') {
      box.innerHTML = `<div class="empty" style="margin-bottom:8px">尺寸線：<b>${fmt(Math.hypot(it.x2 - it.x1, it.y2 - it.y1))}</b> 公分</div>${acts}`;
    }
  });
}
function propsChange(e) {
  const f = e.target.dataset.f; if (!f || SEL.length !== 1) return;
  const it = byId(SEL[0]), v = e.target.value;
  commit(() => {
    if (f === 'name' || f === 'note' || f === 'cat' || f === 'ot' || f === 'mk') { it[f] = v; if (f === 'cat') delete it.color; if (f === 'ot') it.name = OPENS.find(o => o[0] === v)[1]; if (f === 'mk') it.name = MARKS.find(o => o[0] === v)[1]; }
    else if (f === 'color') it.color = v;
    else if (f === 'w') { it.w = Math.max(5, +v || it.w); if (it.round) it.d = it.w; if (it.t === 'open') snapToWall(it, it.cx, it.cy); }
    else if (f === 'd') it.d = Math.max(5, +v || it.d);
    else if (f === 'rot') it.rot = (((+v || 0) % 360) + 360) % 360;
    else if (f === 'px' || f === 'py') { const B = aabb(it); if (f === 'px') it.cx = r1(it.cx + (+v - B.l)); else it.cy = r1(it.cy + (+v - B.t)); }
    else if (f === 'text') { it.text = v || '文字'; sizeText(it); }
    else if (f === 'fs') { it.fs = Math.max(5, +v || 24); sizeText(it); }
  });
}
function propsClick(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'del') deleteSel();
  if (a === 'dup') duplicateSel();
  if (a === 'rot') rotateSel(+k);
  if (a === 'flip') commit(() => { const it = byId(SEL[0]); it.flip = it.flip ? 0 : 1; });
  if (a === 'out') commit(() => { const it = byId(SEL[0]); it.out = it.out ? 0 : 1; });
  if (a === 'al') {
    const box = unionBox(SEL);
    commit(() => SEL.forEach(id => { const it = byId(id); if (it.t === 'dim') return; const B = aabb(it);
      const d = k === 'l' ? [box.l - B.l, 0] : k === 'r' ? [box.r - B.r, 0] : k === 't' ? [0, box.t - B.t] : [0, box.b - B.b];
      moveBy(it, d[0], d[1]); }));
  }
}
$('#rpane').addEventListener('change', propsChange);
$('#rpane').addEventListener('click', propsClick);

/* ================= 右側：檢查結果、設備清單 ================= */
function renderWarns() {
  const box = $('#warns');
  if (!G.ok) { box.innerHTML = '<div class="warn amber">牆面還沒圍起來</div>'; return; }
  if (!S.items.some(isEquip)) { box.innerHTML = '<div class="empty">擺了設備之後，這裡會自動檢查重疊、超出牆外、走道太窄。</div>'; return; }
  if (!WARNS.length) { box.innerHTML = `<div class="warn ok">✓ 沒發現問題${S.set.aisle ? `（走道都 ≥ ${S.set.aisleMin} 公分）` : ''}</div>`; return; }
  box.innerHTML = '<div class="warns">' + WARNS.map((w, i) => `<button class="warn ${w.type === 'aisle' ? 'amber' : ''}" data-w="${i}">${w.type === 'aisle' ? '🚶' : w.type === 'out' ? '🧱' : '⛔'} ${esc(w.msg)}</button>`).join('') + '</div>';
}
$('#warns').addEventListener('click', e => { const b = e.target.closest('[data-w]'); if (!b) return; SEL = WARNS[+b.dataset.w].ids.slice(); refresh(); });

function equipList() {
  const groups = new Map();
  const secName = it => it.t === 'open' ? '門窗' : it.t === 'mark' ? '水電孔位' : (CATS[it.cat]?.name || '其他');
  const order = [...Object.values(CATS).map(c => c.name), '門窗', '水電孔位'];
  for (const it of S.items) {
    if (it.t === 'dim' || it.t === 'text') continue;
    const size = it.t === 'mark' ? '—' : it.t === 'open' ? `寬 ${fmt(it.w)}` : it.round ? `Ø${fmt(it.w)}` : `${fmt(it.w)}×${fmt(it.d)}`;
    const key = secName(it) + '|' + it.name + '|' + size;
    if (!groups.has(key)) groups.set(key, { sec: secName(it), name: it.name, size, n: 0, notes: new Set() });
    const g = groups.get(key); g.n++; if (it.note) g.notes.add(it.note);
  }
  return [...groups.values()].sort((a, b) => order.indexOf(a.sec) - order.indexOf(b.sec) || a.name.localeCompare(b.name, 'zh-Hant'));
}
function renderList() {
  const L = equipList();
  if (!L.length) { $('#list').innerHTML = '<div class="empty">還沒有設備</div>'; return; }
  let sec = '', h = '<table class="list"><tr><th>名稱</th><th>尺寸</th><th class="n">數量</th></tr>';
  for (const g of L) {
    if (g.sec !== sec) { sec = g.sec; h += `<tr class="cat"><td colspan="3">${esc(sec)}</td></tr>`; }
    h += `<tr><td>${esc(g.name)}${g.notes.size ? `<br><span class="hint">${esc([...g.notes].join('／'))}</span>` : ''}</td><td class="n">${g.size}</td><td class="n">${g.n}</td></tr>`;
  }
  $('#list').innerHTML = h + '</table>';
}

/* ================= 匯出 ================= */
function buildExport(opt) {
  G = roomGeo(); runChecks();
  const B = contentBounds();
  const bw = B.r - B.l, bh = B.b - B.t;
  const k = 2.6;                                // 線與字放大倍數（輸出圖比較大）
  const s = clamp(Math.min(2300 / bw, 1500 / bh), .3, 5);
  const pad = 70 * k + 40;                      // 留給尺寸線的邊
  const dW = bw * s + pad * 2, dH = bh * s + pad * 2;
  const W = Math.max(Math.round(dW) + 80, 1800);
  const head = 130, top = head + 20;
  const ox = (W - dW) / 2 + pad - B.l * s, oy = top + pad - B.t * s;
  // 設備清單排成幾欄
  const L = opt.list ? equipList() : [];
  const rows = []; let sec = '';
  for (const g of L) { if (g.sec !== sec) { sec = g.sec; rows.push({ head: sec }); } rows.push(g); }
  const colW = 660, cols = Math.max(1, Math.floor((W - 80) / colW)), per = Math.ceil(rows.length / cols) || 0;
  const rowH = 44, listTop = top + dH + 30, listH = rows.length ? 80 + per * rowH : 0;
  const footTop = listTop + listH + 20, H = Math.round(footTop + 90);
  const m2 = G.area / 10000;
  let s2 = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  <defs>${defsSVG()}</defs>
  <style>text{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}</style>
  <rect width="${W}" height="${H}" fill="#fff"/>
  <rect width="${W}" height="${head}" fill="#1A1A16"/>
  <rect x="0" y="${head - 6}" width="${W}" height="6" fill="#C3F000"/>
  <text x="40" y="62" font-size="44" font-weight="800" fill="#C3F000">${esc(S.meta.name || '店面平面圖')}</text>
  <text x="40" y="100" font-size="22" fill="#d8d8d0">店面平面示意圖　｜　單位：公分（cm）　｜　室內面積約 ${fmt(m2)} ㎡（${fmt(m2 / 3.3058)} 坪）</text>
  <text x="${W - 40}" y="58" font-size="22" fill="#d8d8d0" text-anchor="end">${esc(S.meta.addr || '')}</text>
  <text x="${W - 40}" y="96" font-size="22" fill="#d8d8d0" text-anchor="end">${S.meta.author ? '繪製：' + esc(S.meta.author) + '　' : ''}日期：${todayTW()}</text>
  <g transform="translate(${ox} ${oy}) scale(${s})">${sceneSVG({ s, k, screen: false }, { warn: opt.warn, angles: opt.angles })}</g>`;
  if (rows.length) {
    s2 += `<line x1="40" y1="${listTop}" x2="${W - 40}" y2="${listTop}" stroke="#e3e3da" stroke-width="2"/>
    <text x="40" y="${listTop + 50}" font-size="32" font-weight="800" fill="#1A1A16">設備清單</text>`;
    rows.forEach((r, i) => {
      const c = Math.floor(i / per), j = i % per, x = 40 + c * colW, y = listTop + 80 + j * rowH + 30;
      if (r.head) s2 += `<rect x="${x}" y="${y - 30}" width="${colW - 30}" height="${rowH - 4}" rx="6" fill="#f3f3ee"/><text x="${x + 12}" y="${y}" font-size="24" font-weight="800" fill="#5a5a52">${esc(r.head)}</text>`;
      else s2 += `<text x="${x + 12}" y="${y}" font-size="24" fill="#1A1A16">${esc(r.name)}${r.notes.size ? `<tspan fill="#9a9a92" font-size="19">　${esc([...r.notes].join('／'))}</tspan>` : ''}</text>
        <text x="${x + colW - 140}" y="${y}" font-size="24" fill="#5a5a52" text-anchor="end">${r.size}</text>
        <text x="${x + colW - 44}" y="${y}" font-size="24" font-weight="800" fill="#1A1A16" text-anchor="end">× ${r.n}</text>`;
    });
  }
  // 比例尺與註記
  const bar = 100 * s;
  s2 += `<g transform="translate(40 ${footTop + 20})">
    <rect width="${bar}" height="10" fill="#1A1A16"/><rect x="${bar}" width="${bar}" height="10" fill="#fff" stroke="#1A1A16" stroke-width="2"/>
    <text y="42" font-size="22" fill="#5a5a52">0</text><text x="${bar}" y="42" font-size="22" fill="#5a5a52" text-anchor="middle">1 m</text><text x="${bar * 2}" y="42" font-size="22" fill="#5a5a52" text-anchor="middle">2 m</text></g>
  <text x="${W - 40}" y="${footTop + 34}" font-size="22" fill="#7a7a72" text-anchor="end">尺寸為室內淨尺寸；本圖為示意圖，施工前請以現場丈量為準。</text>
  <text x="${W - 40}" y="${footTop + 66}" font-size="18" fill="#b8b8ae" text-anchor="end">店面平面圖小幫手</text>
  </svg>`;
  return { svg: s2, W, H };
}
function fileName(ext) { return `${(S.meta.name || '店面平面圖').replace(/[\\/:*?"<>|]/g, '')}_平面圖_${todayTW()}.${ext}`; }
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportPNG(opt) {
  const { svg: str, W, H } = buildExport(opt);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.drawImage(img, 0, 0);
    c.toBlob(b => { downloadBlob(b, fileName('png')); toast('✓ 已下載 <b>PNG 圖檔</b>'); }, 'image/png');
  };
  img.onerror = () => toast('產生圖檔失敗，請改用「列印／存成 PDF」');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
}
function exportPDF(opt) {
  const { svg: str } = buildExport(opt);
  $('#pageStyle').textContent = `@page { size: ${opt.paper} landscape; margin: 8mm; }`;
  $('#printArea').innerHTML = str;
  setTimeout(() => { window.print(); }, 80);
}
function exportCSV() {
  const L = equipList();
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const lines = [['分類', '名稱', '尺寸（公分）', '數量', '備註'].map(q).join(',')];
  for (const g of L) lines.push([g.sec, g.name, g.size, g.n, [...g.notes].join('／')].map(q).join(','));
  downloadBlob(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), fileName('csv').replace('_平面圖_', '_設備清單_'));
  toast('✓ 已下載 <b>設備清單</b>（可用 Excel 打開）');
}
function exportProject() {
  const data = JSON.stringify({ app: 'storeplan', v: 1, meta: S.meta, room: S.room, items: S.items, custom: S.custom, set: S.set }, null, 1);
  downloadBlob(new Blob([data], { type: 'application/json' }), fileName('json').replace('_平面圖_', '_專案檔_'));
  DIRTY = false;
  toast('✓ 已下載 <b>專案檔</b>，下次用「📂 檔案 → 開啟專案檔」就能接著改');
}
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });

/* ================= 彈窗 ================= */
function modal(html, onMount) {
  const m = document.createElement('div'); m.className = 'mask';
  m.innerHTML = `<div class="modal">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); });
  document.body.appendChild(m); onMount?.(m); return m;
}
function ask(msg, ok = '確定') {
  return new Promise(res => {
    const m = modal(`<div class="mh">確認一下</div><div class="mb">${msg}</div><div class="mf"><button class="btn" data-no>取消</button><button class="btn dark" data-yes>${ok}</button></div>`);
    m.querySelector('[data-no]').onclick = () => { m.remove(); res(false); };
    m.querySelector('[data-yes]').onclick = () => { m.remove(); res(true); };
  });
}
let toastT;
function toast(html) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200);
}

      <p class="hint">⚠️ 這個工具<b>不會幫你存檔</b>，關掉網頁就沒了。還想再改的話，記得下載「專案檔」。<br>存 PDF：列印視窗的「目的地」選「另存為 PDF」。</p>

      const b = e.target.closest('[data-x]'); if (!b) return;

      if ((f === 'sample' || f === 'new' || f === 'open') && DIRTY && !first) {
        m.style.display = 'none';
        const ok = await ask('目前的圖還沒下載專案檔，換掉就找不回來了。<br>確定要繼續嗎？', '確定換掉');
        if (!ok) { m.style.display = ''; return; }
      }
      m.remove();
      if (f === 'sample') loadProject(sampleProject());
      if (f === 'new') { loadProject(blankProject(600, 400)); showTab('room'); startWall(); }
      if (f === 'open') $('#fileIn').click();
    });
  });
}
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (o.app !== 'storeplan' || !o.room || !Array.isArray(o.items)) throw new Error('格式不對');
    loadProject(o); toast('✓ 已開啟 <b>' + esc(o.meta?.name || f.name) + '</b>');
  } catch (err) { toast('這個檔案不是平面圖專案檔，打不開'); }
});
function loadProject(o) {
  const base = blankProject(600, 400);
  S = { ...base, ...o, meta: { ...base.meta, ...(o.meta || {}) }, set: { ...base.set, ...(o.set || {}) }, custom: o.custom || [] };
  if (!S.room.pts) setRoomFromPts(segsToPts(S.room)); // 舊版專案檔
  SEL = []; UNDO = []; REDO = []; DIRTY = false; WP = [];
  renderRoom(); renderLib(); renderMark(); fitView(); renderProps();
}

/* ================= 範例：小吃店 844 × 390 ================= */
function sampleProject() {
  const p = blankProject(844, 390);
  p.meta = { name: '範例小吃店', addr: '一樓店面・前面鐵捲門', author: '', note: '' };
  const find = n => LIB.findIndex(l => l[1] === n);
  const put = (name, l, t, rot = 0, extra = {}) => {
    const [cat, nm, w, d, sym, ex = {}] = LIB[find(name)];
    const aw = rot % 180 ? d : w, ad = rot % 180 ? w : d;
    p.items.push({ id: uid(), t: 'equip', cat, name: nm, w, d, sym, rot, note: '', cx: l + aw / 2, cy: t + ad / 2, ...(ex.round ? { round: 1 } : {}), ...(ex.over ? { over: 1 } : {}), ...(ex.floor ? { floor: 1 } : {}), ...extra });
  };
  // 內場靠上牆一排
  put('油炸機（雙槽）', 0, 0, 0, { note: '220V' });
  put('平板煎台', 60, 0);
  put('四口爐', 150, 0);
  put('工作台冰箱 5尺', 230, 0);
  put('雙槽水槽', 380, 0);
  put('掀門式洗碗機', 500, 0, 0, { note: '220V' });
  put('殘渣台', 565, 0);
  put('層架', 655, 0);
  put('柱子', 804, 0);
  put('排油煙罩（在上方）', 0, 0);
  // 中島出餐與收銀
  put('出餐台', 150, 160);
  put('蛋糕／冷藏展示櫃', 300, 165);
  put('POS 收銀台', 0, 175, 90);
  put('地板排水溝', 150, 100);
  // 外場座位
  for (const l of [120, 300, 480]) { put('四人桌', l, 315); put('單椅', l + 8, 268); put('單椅', l + 67, 268); }
  put('二人桌', 690, 170); put('二人桌', 690, 280);
  // 門窗（先放約略位置，載入後會貼到牆上）
  p.items.push({ id: uid(), t: 'open', ot: 'shutter', name: '鐵捲門', w: 300, d: 15, cx: 844, cy: 195, rot: 0 });
  p.items.push({ id: uid(), t: 'open', ot: 'door', name: '單開門', w: 80, d: 15, cx: 0, cy: 340, rot: 0, flip: 0, out: 0 });
  p.items.push({ id: uid(), t: 'open', ot: 'window', name: '窗戶', w: 180, d: 15, cx: 390, cy: 390, rot: 0 });
  // 水電孔位
  const mk = (k, x, y, note = '') => { const m = MARKS.find(z => z[0] === k); p.items.push({ id: uid(), t: 'mark', mk: k, name: m[1], w: 22, d: 22, cx: x, cy: y, rot: 0, note }); };
  mk('water', 420, 12, '水槽龍頭'); mk('drain', 460, 48); mk('gas', 190, 12, '四口爐用'); mk('v220', 30, 12, '炸爐 220V');
  mk('fan', 120, 50, '排煙管出口'); mk('v110', 30, 300, '收銀機'); mk('drain', 532, 48, '洗碗機');
  // 區域文字
  const tx = (text, x, y, fs) => { const it = { id: uid(), t: 'text', text, fs, rot: 0, cx: x, cy: y }; sizeText(it); p.items.push(it); };
  tx('內場', 560, 120, 26); tx('外場用餐區', 560, 235, 26);
  // 載入後再把門窗貼牆
  setTimeout(() => { reSnapOpens(); render(); }, 0);
  return p;
}

/* ================= 分頁、工具列 ================= */
function showTab(k) {
  TAB = k;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === k));
  for (const p of ['room', 'lib', 'mark', 'prop']) $('#pane-' + p).hidden = p !== k;
  render();
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });

function setMode(m, keep) {
  if (MODE === 'wall' && m !== 'wall') { WP = []; WD = null; }
  MODE = m; DIMA = null; DIMP = null;
  $('#bSelect').classList.toggle('on', m === 'select'); $('#bDim').classList.toggle('on', m === 'dim'); $('#bWall').classList.toggle('on', m === 'wall');
  $('#modeHint').hidden = m === 'select';
  $('#bWallUndo').hidden = !(m === 'wall' && WP.length);
  if (m === 'wall') {
    $('#modeTxt').innerHTML = !WP.length ? '✏️ 在畫面上<b>按住滑鼠、拉出第一面牆</b>，放開就畫好（Esc 取消）'
      : WP.length < 3 ? `✏️ 很好！從<b>綠色點</b>接著拉下一面牆（已畫 ${WP.length - 1} 面）`
      : `✏️ 已畫 ${WP.length - 1} 面，<b>拉回起點</b>就圍起來，或按「完成」自動接回`;
    $('#bDimDone').textContent = '完成';
  } else if (m === 'dim') {
    $('#modeTxt').innerHTML = '📏 點<b>第一個點</b>，再點<b>第二個點</b>就會標出距離';
    $('#bDimDone').textContent = '完成';
  }
  svg.classList.toggle('dim', m === 'dim' || m === 'wall');
  if (m !== 'select' && !keep) { SEL = []; renderProps(); }
  render();
}
$('#bSelect').onclick = () => setMode('select');
$('#bDim').onclick = () => setMode(MODE === 'dim' ? 'select' : 'dim');
$('#bDimDone').onclick = () => MODE === 'wall' ? finishWall() : setMode('select');
$('#bWallUndo').onclick = () => { WP.pop(); setMode('wall', true); };
$('#bWall').onclick = () => MODE === 'wall' ? cancelWall() : (showTab('room'), startWall());
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bFit').onclick = fitView;
$('#bZoomIn').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
$('#bZoomOut').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(.8, r.width / 2, r.height / 2); };
for (const [id, k] of [['tGrid', 'grid'], ['tSnap', 'snap'], ['tDims', 'dims'], ['tAisle', 'aisle']]) $('#' + id).onclick = () => { S.set[k] = !S.set[k]; render(); };
$('#bExport').onclick = openExport;
$('#bFile').onclick = () => openFile(false);
// 清空：牆面留著，其他全部清掉（可以按復原救回來）
$('#bClear').onclick = async () => {
  if (!S.items.length) { toast('圖面已經是空的了'); return; }
  if (!await ask('要把<b>設備、門窗、孔位、文字、尺寸線</b>全部清掉嗎？<br>牆面會保留。清錯了可以按「↶ 復原」救回來。', '全部清空')) return;
  SEL = []; commit(() => { S.items = []; });
  toast('✓ 已清空，牆面保留。按 <b>↶ 復原</b> 可以救回來');
};
window.addEventListener('beforeunload', e => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

/* 平板：右側面板搬到左邊第 4 個分頁；手機：只能看 */
const mqTab = window.matchMedia('(max-width:1099px)'), mqMob = window.matchMedia('(max-width:767px)');
function layout() {
  const rp = $('#rpane');
  if (mqTab.matches) { if (rp.parentElement.id !== 'pane-prop') $('#pane-prop').appendChild(rp); rp.style.padding = '0'; }
  else { if (rp.parentElement.id !== 'sideR') $('#sideR').appendChild(rp); rp.style.padding = ''; if ($('#pane-prop').hidden === false) showTab('room'); }
  VIEWONLY = mqMob.matches;
  if (VIEWONLY) { SEL = []; setMode('select'); }
  setTimeout(fitView, 30);
}
mqTab.addEventListener('change', layout); mqMob.addEventListener('change', layout);
new ResizeObserver(() => render()).observe($('#stage'));

/* ================= 啟動 ================= */
if (window.self !== window.top) document.body.classList.add('embed');
renderRoom(); renderLib(); renderMark(); renderProps();
layout();
// 網址後面加 #sample 會直接打開範例（做截圖、教學影片用）
setTimeout(() => { fitView(); if (location.hash === '#sample') loadProject(sampleProject()); else openFile(true); }, 60);
</script>
</body>
