<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店面平面圖小幫手</title>
<style>
:root {
  --green: #C3F000; --green-dark: #7FA000; --green-soft: rgba(195,240,0,.2);
  --orange: #FFAA00; --red: #E0483E; --red-soft: rgba(224,72,62,.1);
  --dark: #1A1A16; --bg: #fafaf7; --surface: #fff; --surface2: #f3f3ee;
  --border: #e3e3da; --text: #1a1a16; --text2: #5a5a52; --text3: #9a9a92;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; height: 100vh; min-height: 640px; overflow: hidden; }
/* 嵌在會員站 iframe 裡：iframe 會跟著 body 高度長，所以給固定高度避免無限長高 */
body.embed { height: 880px; }
button, select, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
[hidden] { display: none !important; }

/* ---- 頁首 ---- */
header { background: var(--dark); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex: none; }
header h1 { font-size: 1.1rem; font-weight: 800; white-space: nowrap; }
header h1 b { color: var(--green); }
header .steps { display: flex; gap: 6px; font-size: .78rem; color: #b8b8ae; flex-wrap: wrap; }
header .steps span { background: rgba(255,255,255,.08); padding: 2px 9px; border-radius: 99px; }
header .steps span i { font-style: normal; color: var(--green); font-weight: 800; margin-right: 3px; }

/* ---- 工具列 ---- */
.toolbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 6px 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; flex: none; }
.toolbar .sep { width: 1px; height: 24px; background: var(--border); margin: 0 2px; }
.tb { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); display: inline-flex; align-items: center; gap: 5px; font-size: .84rem; white-space: nowrap; }
.tb:hover { background: var(--surface2); }
.tb.on { background: var(--dark); color: var(--green); border-color: var(--dark); }
.tb:disabled { opacity: .35; cursor: default; }
.tb.primary { background: var(--green); border-color: var(--green); font-weight: 800; color: var(--dark); }
.tb.primary:hover { filter: brightness(.95); }
.toolbar .grow { flex: 1; }
.zoomlbl { font-size: .8rem; color: var(--text2); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }

/* ---- 主畫面 ---- */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px 1fr 280px; }
.side { background: var(--surface); overflow-y: auto; min-height: 0; }
#sideL { border-right: 1px solid var(--border); display: flex; flex-direction: column; }
#sideR { border-left: 1px solid var(--border); }
.tabs { display: flex; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; flex: none; }
.tabs button { flex: 1; padding: 10px 4px 9px; font-size: .84rem; font-weight: 700; color: var(--text3); border-bottom: 3px solid transparent; }
.tabs button i { font-style: normal; display: inline-flex; width: 18px; height: 18px; border-radius: 50%; background: var(--surface2); color: var(--text3); font-size: .72rem; align-items: center; justify-content: center; margin-right: 4px; }
.tabs button.on { color: var(--text); border-bottom-color: var(--green); }
.tabs button.on i { background: var(--dark); color: var(--green); }
.tabpane { padding: 12px 14px 24px; display: flex; flex-direction: column; gap: 14px; }
.sec h3 { font-size: .86rem; font-weight: 800; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
.sec h3 small { font-weight: 400; color: var(--text3); font-size: .74rem; }
.hint { font-size: .78rem; color: var(--text3); line-height: 1.5; }
.hint b { color: var(--text2); }
.fld { display: flex; flex-direction: column; gap: 3px; margin-bottom: 7px; }
.fld label { font-size: .76rem; color: var(--text2); font-weight: 700; }
.inp { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); min-width: 0; }
.inp:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: var(--green-dark); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.unit { position: relative; }
.unit .inp { padding-right: 30px; }
.unit::after { content: attr(data-u); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: .72rem; color: var(--text3); pointer-events: none; }
.btn { padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: .82rem; font-weight: 700; }
.btn:hover { background: var(--surface2); }
.btn.dark { background: var(--dark); color: var(--green); border-color: var(--dark); }
.btn.green { background: var(--green); border-color: var(--green); color: var(--dark); }
.btn.red { color: var(--red); }
.btn.sm { padding: 4px 8px; font-size: .76rem; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); font-size: .8rem; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--dark); }
.chip .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* 牆面表 */
.segs { display: flex; flex-direction: column; gap: 5px; }
.seg { display: grid; grid-template-columns: 22px 1fr 1fr 26px; gap: 5px; align-items: center; }
.seg .no { font-size: .74rem; color: var(--text3); text-align: center; font-weight: 700; }
.seg .x { color: var(--text3); font-size: 1rem; height: 30px; border-radius: 6px; }
.seg .x:hover { background: var(--red-soft); color: var(--red); }
.seg.close { color: var(--text3); font-size: .78rem; }
.okline { font-size: .78rem; padding: 6px 9px; border-radius: 7px; background: var(--green-soft); color: #3d4d00; }
.okline.warn { background: rgba(255,170,0,.16); color: #8a5a00; }
.area { display: flex; gap: 10px; font-size: .8rem; color: var(--text2); background: var(--surface2); padding: 7px 10px; border-radius: 8px; }
.area b { color: var(--text); font-variant-numeric: tabular-nums; }

/* 設備庫 */
.libcat { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.libcat > summary { list-style: none; cursor: pointer; padding: 8px 10px; font-weight: 800; font-size: .84rem; display: flex; align-items: center; gap: 7px; background: var(--surface2); }
.libcat > summary::-webkit-details-marker { display: none; }
.libcat > summary .dot { width: 11px; height: 11px; border-radius: 3px; }
.libcat > summary .c { margin-left: auto; font-weight: 400; color: var(--text3); font-size: .74rem; }
.libitems { display: flex; flex-direction: column; }
.libitem { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--border); text-align: left; font-size: .82rem; }
.libitem:hover { background: var(--green-soft); }
.libitem .sz { margin-left: auto; color: var(--text3); font-size: .74rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.libitem .plus { width: 20px; height: 20px; border-radius: 6px; background: var(--dark); color: var(--green); font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex: none; font-size: .9rem; }

/* 右側 */
.rpane { padding: 12px 14px 24px; display: flex; flex-direction: column; gap: 16px; }
.empty { font-size: .8rem; color: var(--text3); background: var(--surface2); border-radius: 8px; padding: 10px; }
.warns { display: flex; flex-direction: column; gap: 5px; }
.warn { text-align: left; font-size: .79rem; padding: 7px 9px; border-radius: 8px; background: var(--red-soft); color: #9c2a22; line-height: 1.4; }
.warn:hover { outline: 1px solid var(--red); }
.warn.ok { background: var(--green-soft); color: #3d4d00; }
.warn.amber { background: rgba(255,170,0,.15); color: #8a5a00; }
table.list { width: 100%; border-collapse: collapse; font-size: .78rem; }
table.list th { text-align: left; font-weight: 700; color: var(--text3); padding: 3px 4px; border-bottom: 1px solid var(--border); }
table.list td { padding: 4px; border-bottom: 1px dashed var(--border); vertical-align: top; }
table.list td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.list tr.cat td { font-weight: 800; color: var(--text2); background: var(--surface2); border-bottom: none; }

/* 畫布 */
#stage { position: relative; background: #eceee6; min-width: 0; min-height: 0; overflow: hidden; }
#svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: default; }
#svg.pan { cursor: grabbing; }
#svg.dim { cursor: crosshair; }
.status { position: absolute; left: 10px; bottom: 8px; background: rgba(26,26,22,.82); color: #e8e8e0; font-size: .74rem; padding: 4px 10px; border-radius: 99px; pointer-events: none; font-variant-numeric: tabular-nums; }
.status b { color: var(--green); }
.modehint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--dark); color: #fff; padding: 7px 14px; border-radius: 99px; font-size: .82rem; box-shadow: 0 4px 14px rgba(0,0,0,.2); display: flex; gap: 10px; align-items: center; }
.modehint b { color: var(--green); }
.modehint button { color: var(--dark); background: var(--green); border-radius: 99px; padding: 2px 10px; font-weight: 800; font-size: .76rem; white-space: nowrap; }
.modehint button.ghost { background: rgba(255,255,255,.14); color: #fff; }
.modehint { max-width: calc(100% - 20px); flex-wrap: wrap; justify-content: center; }
.modehint .buf { background: var(--green); color: var(--dark); border-radius: 6px; padding: 0 6px; font-weight: 800; }
.drawbtn { width: 100%; padding: 11px; border-radius: 10px; background: var(--green); font-weight: 800; font-size: .9rem; color: var(--dark); display: flex; align-items: center; justify-content: center; gap: 6px; }
.drawbtn:hover { filter: brightness(.95); }
.mobilebar { display: none; }

/* 彈窗 */
.mask { position: fixed; inset: 0; background: rgba(26,26,22,.55); display: flex; align-items: flex-start; justify-content: center; z-index: 50; padding: 40px 16px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 16px; max-width: 520px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; }
.modal .mh { background: var(--dark); color: #fff; padding: 14px 18px; font-weight: 800; font-size: 1.02rem; }
.modal .mh b { color: var(--green); }
.modal .mb { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal .mf { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.howto { display: flex; flex-direction: column; gap: 8px; }
.howto div { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; }
.howto i { font-style: normal; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--dark); color: var(--green); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: .8rem; }
.howto p { color: var(--text2); font-size: .8rem; }
.check { display: flex; align-items: center; gap: 8px; font-size: .86rem; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--dark); }
.bigbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bigbtn { border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.bigbtn:hover { border-color: var(--dark); background: var(--surface2); }
.bigbtn b { font-size: .9rem; }
.bigbtn span { font-size: .74rem; color: var(--text3); }
.bigbtn.hl { background: var(--green); border-color: var(--green); }
.bigbtn.hl span { color: #3d4d00; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--dark); color: #fff; padding: 9px 18px; border-radius: 99px; font-size: .86rem; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast b { color: var(--green); }
#printArea { display: none; }

/* ---- 平板：屬性面板收進左側第 4 個分頁 ---- */
.tab4 { display: none; }
@media (max-width: 1099px) {
  .app { grid-template-columns: 280px 1fr; }
  #sideR { display: none; }
  .tab4 { display: block; }
  header .steps { display: none; }
}
/* ---- 手機：只能看圖、下載 ---- */
@media (max-width: 767px) {
  body { height: auto; min-height: 0; overflow: auto; }
  body.embed { height: auto; }
  .app { display: block; }
  #sideL, #sideR, .toolbar .edit { display: none !important; }
  #stage { height: 520px; }
  .mobilebar { display: block; background: rgba(255,170,0,.16); color: #8a5a00; font-size: .8rem; padding: 8px 14px; line-height: 1.5; }
}

/* ---- 列印（存 PDF）：只印圖面 ---- */
@media print {
  body { display: block; height: auto; overflow: visible; background: #fff; }
  body > *:not(#printArea) { display: none !important; }
  #printArea { display: block !important; }
  #printArea svg { width: 100%; height: auto; display: block; }
}
</style>
<style id="pageStyle">@page { size: A4 landscape; margin: 8mm; }</style>
</head>
<body>

<header>
  <h1>店面<b>平面圖</b>小幫手</h1>
  <div class="steps">
    <span><i>1</i>拉線畫出店面</span>
    <span><i>2</i>點設備加進來、拖拉擺好</span>
    <span><i>3</i>輸出圖面給設計師／工班</span>
  </div>
</header>

<div class="mobilebar">📱 手機畫面太小不好擺設備，這裡只能<b>看圖和下載</b>。要編輯請用電腦或平板打開。</div>

<div class="toolbar">
  <button class="tb edit" id="bUndo" title="復原（Ctrl/⌘ + Z）">↶ 復原</button>
  <button class="tb edit" id="bRedo" title="重做（Ctrl/⌘ + Shift + Z）">↷ 重做</button>
  <span class="sep edit"></span>
  <button class="tb edit on" id="bSelect" title="選取與拖拉（Esc）">🖐 選取</button>
  <button class="tb edit" id="bWall" title="按住滑鼠拉線，畫出店面的牆">✏️ 畫牆</button>
  <button class="tb edit" id="bDim" title="自己量兩點距離（M）">📏 量尺寸</button>
  <span class="sep edit"></span>
  <button class="tb" id="bZoomOut" title="縮小">－</button>
  <span class="zoomlbl" id="zoomLbl">100%</span>
  <button class="tb" id="bZoomIn" title="放大">＋</button>
  <button class="tb" id="bFit" title="整張圖放進畫面">⤢ 看全圖</button>
  <span class="sep edit"></span>
  <button class="tb edit" id="tGrid" title="顯示格線（每格 50 公分）">▦ 格線</button>
  <button class="tb edit" id="tSnap" title="拖拉設備靠近牆面或其他設備時，會自動貼齊（按住 Alt 拖拉可暫時不貼）">🧲 自動貼齊</button>
  <button class="tb edit" id="tDims" title="選到設備時顯示它離牆／離其他設備多遠">↔ 距離</button>
  <button class="tb edit" id="tAisle" title="檢查走道寬度與設備重疊">⚠ 走道檢查</button>
  <span class="grow"></span>
  <button class="tb edit" id="bClear" title="把設備、門窗、標註全部清掉，牆面保留">🧹 清空</button>
  <button class="tb" id="bFile" title="開新圖、看範例、開啟專案檔">📂 檔案</button>
  <button class="tb primary" id="bExport">⬇ 輸出圖面</button>
</div>

<div class="app">
  <aside class="side" id="sideL">
    <div class="tabs">
      <button data-tab="room" class="on"><i>1</i>空間</button>
      <button data-tab="lib"><i>2</i>設備</button>
      <button data-tab="mark"><i>3</i>標註</button>
      <button data-tab="prop" class="tab4">屬性</button>
    </div>
    <div class="tabpane" id="pane-room"></div>
    <div class="tabpane" id="pane-lib" hidden></div>
    <div class="tabpane" id="pane-mark" hidden></div>
    <div class="tabpane" id="pane-prop" hidden></div>
  </aside>

  <main id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <defs id="defs"></defs>
      <g id="world"></g>
    </svg>
    <div class="status" id="status"></div>
    <div class="modehint" id="modeHint" hidden><span id="modeTxt"></span><button id="bWallUndo" class="ghost" hidden>↶ 上一點</button><button id="bDimDone">完成</button></div>
  </main>

  <aside class="side" id="sideR">
    <div class="rpane" id="rpane">
      <div class="sec"><h3>✏️ 選到的東西</h3><div id="props"></div></div>
      <div class="sec"><h3>⚠️ 檢查結果 <small>點一下會選到該設備</small></h3><div id="warns"></div></div>
      <div class="sec"><h3>📋 設備清單</h3><div id="list"></div></div>
    </div>
  </aside>
</div>

<div id="printArea"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================
 * 店面平面圖小幫手
 * 單位一律公分（cm），座標原點在第一面牆的起點，x 向右、y 向下
 * 資料不存任何地方：畫完下載圖面，要再改就下載「專案檔」下次開回來
 * ========================================================= */

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r1 = v => Math.round(v * 10) / 10;
const fmt = v => { const x = r1(v); return Number.isInteger(x) ? String(x) : x.toFixed(1); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const NS = 'vector-effect="non-scaling-stroke"';

// ---- 台灣時間的今天（不用 toISOString，避免早上 8 點前抓到昨天）----
function todayTW() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/* ================= 設備庫 ================= */
// solid：會擋路的實體設備（列入走道／重疊檢查）
const CATS = {
  cold:   { name: '冷藏冷凍', color: '#1E7FD8', solid: 1 },
  prep:   { name: '備料清洗', color: '#2E9B47', solid: 1 },
  hot:    { name: '加熱爐具', color: '#E0483E', solid: 1 },
  bar:    { name: '吧台飲料', color: '#8E3FB5', solid: 1 },
  front:  { name: '櫃台出餐', color: '#E07B00', solid: 1 },
  seat:   { name: '座位',     color: '#B08F00', solid: 0 },
  store:  { name: '收納雜項', color: '#7A5A44', solid: 1 },
  struct: { name: '結構',     color: '#56656E', solid: 1 },
  custom: { name: '自訂設備', color: '#1A1A16', solid: 1 },
};
// [分類, 名稱, 寬, 深, 圖示, 額外]
const LIB = [
  ['cold', '四門冰箱', 122, 76, 'x1'], ['cold', '六門冰箱', 183, 76, 'x1'],
  ['cold', '工作台冰箱 4尺', 120, 75, 'x1'], ['cold', '工作台冰箱 5尺', 150, 75, 'x1'], ['cold', '工作台冰箱 6尺', 180, 75, 'x1'],
  ['cold', '臥式冷凍櫃', 150, 70, 'x1'], ['cold', '單門展示冰箱', 60, 65, 'x1'], ['cold', '雙門展示冰箱', 110, 70, 'x1'],
  ['cold', '沙拉冰台', 150, 75, 'x1'], ['cold', '製冰機', 76, 80, 'x1'], ['cold', '組合式冷凍庫', 200, 200, 'x1'],
  ['prep', '不鏽鋼工作台 4尺', 120, 60, 'none'], ['prep', '不鏽鋼工作台 5尺', 150, 60, 'none'], ['prep', '不鏽鋼工作台 6尺', 180, 75, 'none'],
  ['prep', '單槽水槽', 60, 60, 'sink1'], ['prep', '雙槽水槽', 120, 60, 'sink2'], ['prep', '三槽水槽', 180, 60, 'sink3'],
  ['prep', '洗手台', 45, 40, 'sink1'], ['prep', '掀門式洗碗機', 65, 75, 'dish'], ['prep', '殘渣台', 90, 60, 'none'],

/* ================= 狀態 ================= */

function blankProject(W, D) {

/* ================= 幾何：牆面 ================= */
// 舊版專案檔（一面一面輸入方向＋長度）轉成牆角座標
const OLD_DIRS = { R: [1, 0], D: [0, 1], L: [-1, 0], U: [0, -1] };
function segsToPts(r) {
  let x = +r.sx || 0, y = +r.sy || 0; const pts = [[x, y]];
  for (const s of r.segs || []) { const v = OLD_DIRS[s.dir], L = +s.len || 0; if (!v || L <= 0) continue; x += v[0] * L; y += v[1] * L; pts.push([x, y]); }
  return pts;
}

function roomGeo() {
  const r = S.room;
  const raw = (r.pts || segsToPts(r)).map(p => [+p[0], +p[1]]);
  const last = raw[raw.length - 1];
  const closeLen = raw.length ? Math.hypot(last[0] - raw[0][0], last[1] - raw[0][1]) : 0;
  if (closeLen < 0.01 && raw.length > 1) raw.pop();
  // 去掉共線多餘的點
  let P = raw.slice();
  for (let k = 0; k < 3; k++) {
    const out = [];
    for (let i = 0; i < P.length; i++) {
      const a = P[(i - 1 + P.length) % P.length], b = P[i], c = P[(i + 1) % P.length];
      const cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      const same = Math.hypot(b[0] - a[0], b[1] - a[1]) < 0.01;
      if (Math.abs(cr) > 1e-6 && !same) out.push(b);
    }
    P = out;
  }
  if (P.length < 3) return { ok: false, pts: [], edges: [], outer: [], area: 0, closeLen, t: +r.t || 0 };
  let A = 0;
  for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; A += a[0] * b[1] - b[0] * a[1]; }
  const sign = A > 0 ? 1 : -1;
  const edges = P.map((a, i) => {
    const b = P[(i + 1) % P.length], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const ux = (b[0] - a[0]) / len, uy = (b[1] - a[1]) / len;
    return { a, b, len, ux, uy, nx: sign * uy, ny: -sign * ux, i }; // n＝朝外
  });
  const t = Math.max(0, +r.t || 0);
  const outer = P.map((p, i) => {
    const e1 = edges[(i - 1 + P.length) % P.length], e2 = edges[i];
    const p1 = [p[0] + e1.nx * t, p[1] + e1.ny * t], p2 = [p[0] + e2.nx * t, p[1] + e2.ny * t];
    const cr = e1.ux * e2.uy - e1.uy * e2.ux;
    if (Math.abs(cr) < 1e-9) return p1;
    const a = ((p2[0] - p1[0]) * e2.uy - (p2[1] - p1[1]) * e2.ux) / cr;
    return [p1[0] + e1.ux * a, p1[1] + e1.uy * a];
  });
  return { ok: true, pts: P, edges, outer, area: Math.abs(A) / 2, closeLen, t, raw };
}

/* ================= 幾何：物件 ================= */
function corners(it) {
  const a = (it.rot || 0) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), hw = it.w / 2, hd = it.d / 2;
  return [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]].map(([x, y]) => [it.cx + x * c - y * s, it.cy + x * s + y * c]);
}
function aabb(it) {
  if (it.t === 'dim') return { l: Math.min(it.x1, it.x2), r: Math.max(it.x1, it.x2), t: Math.min(it.y1, it.y2), b: Math.max(it.y1, it.y2) };
  const p = corners(it);
  const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
  return { l: Math.min(...xs), r: Math.max(...xs), t: Math.min(...ys), b: Math.max(...ys) };
}
const isEquip = it => it.t === 'equip';
const isSolid = it => isEquip(it) && !it.over && !it.floor && (CATS[it.cat]?.solid ?? 1);
const colorOf = it => it.color || (it.t === 'open' ? OPEN_COLOR : it.t === 'mark' ? (MARKS.find(m => m[0] === it.mk)?.[3] || '#333') : CATS[it.cat]?.color || '#1A1A16');
const byId = id => S.items.find(i => i.id === id);

function overlap(A, B) { // 兩個旋轉矩形是否重疊（分離軸），貼齊不算
  for (const P of [A, B]) for (let i = 0; i < 4; i++) {
    const p1 = P[i], p2 = P[(i + 1) % 4];
    const nx = p2[1] - p1[1], ny = p1[0] - p2[0], len = Math.hypot(nx, ny);
    let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
    for (const q of A) { const v = (q[0] * nx + q[1] * ny) / len; a0 = Math.min(a0, v); a1 = Math.max(a1, v); }
    for (const q of B) { const v = (q[0] * nx + q[1] * ny) / len; b0 = Math.min(b0, v); b1 = Math.max(b1, v); }
    if (Math.min(a1, b1) - Math.max(a0, b0) <= 0.5) return false;
  }
  return true;
}
function distSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
  let t = L2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2 : 0; t = clamp(t, 0, 1);
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
}
function inPoly(p, P) {
  for (let i = 0; i < P.length; i++) if (distSeg(p, P[i], P[(i + 1) % P.length]) < 0.6) return true;
  let inside = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const [xi, yi] = P[i], [xj, yj] = P[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function textW(s, fs) { let w = 0; for (const ch of String(s)) w += /[\x00-\xff]/.test(ch) ? fs * .58 : fs; return w; }

/* 門窗貼到最近的牆：設定中心點與角度（區域座標 +y 一律朝室內） */
function snapToWall(it, px, py) {
  if (!G || !G.ok) { it.cx = px; it.cy = py; return; }
  let best = null;
  for (const e of G.edges) {
    const half = Math.min(it.w / 2, e.len / 2);
    let t = ((px - e.a[0]) * e.ux + (py - e.a[1]) * e.uy);
    t = clamp(t, half, e.len - half);
    const q = [e.a[0] + e.ux * t, e.a[1] + e.uy * t];
    const d = Math.hypot(px - q[0], py - q[1]);
    if (!best || d < best.d) best = { d, q, e };
  }
  const e = best.e;
  it.cx = r1(best.q[0]); it.cy = r1(best.q[1]);
  // 區域 y 軸 = (-sin, cos) 要等於朝內 (-nx, -ny)
  let rot = Math.atan2(e.uy, e.ux);
  if (Math.abs(-Math.sin(rot) + e.nx) > .01 || Math.abs(Math.cos(rot) + e.ny) > .01) rot += Math.PI;
  it.rot = Math.round(((rot * 180 / Math.PI) % 360 + 360) % 360);
}

/* ================= 檢查：走道、重疊、超出牆外 ================= */
function runChecks() {
  const W = [];
  if (!G || !G.ok) { WARNS = W; return; }
  const solids = S.items.filter(isSolid);
  const boxes = new Map(solids.map(it => [it.id, aabb(it)]));
  // 1. 重疊
  for (let i = 0; i < solids.length; i++) for (let j = i + 1; j < solids.length; j++) {
    if (overlap(corners(solids[i]), corners(solids[j]))) W.push({ type: 'overlap', ids: [solids[i].id, solids[j].id], msg: `「${solids[i].name}」和「${solids[j].name}」重疊了` });
  }
  // 2. 超出牆外
  for (const it of S.items.filter(i => i.t === 'equip')) {
    if (corners(it).some(p => !inPoly(p, G.pts))) W.push({ type: 'out', ids: [it.id], msg: `「${it.name}」超出牆外` });
  }
  // 3. 走道寬度：每個設備往四個方向找最近的障礙物，間距在 35～最小走道 之間就提醒（35 以下當成縫隙）
  if (S.set.aisle) {
    const min = +S.set.aisleMin || 90, seen = new Set();
    const hEdges = G.edges.filter(e => Math.abs(e.uy) < 1e-6), vEdges = G.edges.filter(e => Math.abs(e.ux) < 1e-6);
    const ov = (a0, a1, b0, b1) => Math.min(a1, b1) - Math.max(a0, b0);
    for (const it of solids) {
      const A = boxes.get(it.id);
      const dirs = [
        { k: 'down', axis: 'y', from: A.b, sign: 1 }, { k: 'up', axis: 'y', from: A.t, sign: -1 },
        { k: 'right', axis: 'x', from: A.r, sign: 1 }, { k: 'left', axis: 'x', from: A.l, sign: -1 },
      ];
      for (const d of dirs) {
        let best = null;
        for (const o of solids) {
          if (o.id === it.id) continue;
          const B = boxes.get(o.id);
          const o1 = d.axis === 'y' ? ov(A.l, A.r, B.l, B.r) : ov(A.t, A.b, B.t, B.b);
          if (o1 < 30) continue;
          const face = d.axis === 'y' ? (d.sign > 0 ? B.t : B.b) : (d.sign > 0 ? B.l : B.r);
          const gap = (face - d.from) * d.sign;
          if (gap < -0.5) continue;
          if (!best || gap < best.gap) best = { gap, id: o.id, name: o.name, B, o1 };
        }
        for (const e of (d.axis === 'y' ? hEdges : vEdges)) {
          const o1 = d.axis === 'y' ? ov(A.l, A.r, Math.min(e.a[0], e.b[0]), Math.max(e.a[0], e.b[0])) : ov(A.t, A.b, Math.min(e.a[1], e.b[1]), Math.max(e.a[1], e.b[1]));
          if (o1 < 30) continue;
          const face = d.axis === 'y' ? e.a[1] : e.a[0];
          const gap = (face - d.from) * d.sign;
          if (gap < -0.5) continue;
          if (!best || gap < best.gap) best = { gap, wall: e.i, name: '牆面', o1, e };
        }
        if (!best || best.gap < 35 || best.gap >= min) continue;
        const key = best.id ? [it.id, best.id].sort().join('|') + d.axis : it.id + '|w' + best.wall;
        if (seen.has(key)) continue; seen.add(key);
        // 標示線的位置：兩者重疊段的中間
        let mid;
        if (best.B) mid = d.axis === 'y' ? (Math.max(A.l, best.B.l) + Math.min(A.r, best.B.r)) / 2 : (Math.max(A.t, best.B.t) + Math.min(A.b, best.B.b)) / 2;
        else { const e = best.e; mid = d.axis === 'y' ? (Math.max(A.l, Math.min(e.a[0], e.b[0])) + Math.min(A.r, Math.max(e.a[0], e.b[0]))) / 2 : (Math.max(A.t, Math.min(e.a[1], e.b[1])) + Math.min(A.b, Math.max(e.a[1], e.b[1]))) / 2; }
        const p1 = d.axis === 'y' ? [mid, d.from] : [d.from, mid];
        const p2 = d.axis === 'y' ? [mid, d.from + best.gap * d.sign] : [d.from + best.gap * d.sign, mid];
        W.push({ type: 'aisle', ids: best.id ? [it.id, best.id] : [it.id], gap: best.gap, p1, p2,
          msg: `「${it.name}」和「${best.name}」之間走道只有 ${fmt(best.gap)} 公分（建議至少 ${min}）` });
      }
    }
  }
  WARNS = W;
}

/* ================= 畫圖：SVG 片段 ================= */
function defsSVG() {
  return `
  <pattern id="pGrid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#d6d8cf" stroke-width="1" ${NS}/></pattern>

}

// 尺寸線（建築圖的斜線端點）
function dimSVG(x1, y1, x2, y2, off, txt, col, ui, opt = {}) {
  const L = Math.hypot(x2 - x1, y2 - y1); if (L < 0.5) return '';
  const px = ui.k / ui.s;
  const ux = (x2 - x1) / L, uy = (y2 - y1) / L, nx = -uy, ny = ux;
  const a = [x1 + nx * off, y1 + ny * off], b = [x2 + nx * off, y2 + ny * off];
  const sw = opt.w || 1;
  let s = '';
  if (off) {
    const sg = Math.sign(off), g = 3 * px, ex = 5 * px;
    for (const [p, q] of [[[x1, y1], a], [[x2, y2], b]])
      s += `<line x1="${p[0] + nx * sg * g}" y1="${p[1] + ny * sg * g}" x2="${q[0] + nx * sg * ex}" y2="${q[1] + ny * sg * ex}" stroke="${col}" stroke-width=".8" ${NS}/>`;
  }
  s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="${sw}" ${NS}${opt.dash ? ' stroke-dasharray="5 3"' : ''}/>`;
  const tk = 4.5 * px, tx = (ux + nx) * tk * .7071, ty = (uy + ny) * tk * .7071;
  for (const p of [a, b]) s += `<line x1="${p[0] - tx}" y1="${p[1] - ty}" x2="${p[0] + tx}" y2="${p[1] + ty}" stroke="${col}" stroke-width="1.6" ${NS}/>`;
  let ang = Math.atan2(uy, ux) * 180 / Math.PI;
  if (ang > 90.5) ang -= 180; if (ang <= -89.5) ang += 180;
  const sg = off ? Math.sign(off) : -1;
  // 文字放在線的外側；把方向轉成「螢幕上方」
  const fs = (opt.fs || 11) * px;
  let tnx = nx * sg, tny = ny * sg;
  const mx = (a[0] + b[0]) / 2 + tnx * fs * .75, my = (a[1] + b[1]) / 2 + tny * fs * .75;
  if (opt.pill) { // 可以點的數字：加一個膠囊底，看起來像按鈕
    const tw = textW(txt, fs) + fs * 1.1, th = fs * 1.6;
    s += `<rect x="${mx - tw / 2}" y="${my - th / 2}" width="${tw}" height="${th}" rx="${th / 2}" transform="rotate(${ang} ${mx} ${my})" fill="#fff" stroke="${col}" stroke-width="1.2" ${NS}/>`;
  }
  s += `<text x="${mx}" y="${my}" font-size="${fs}" text-anchor="middle" dominant-baseline="central" transform="rotate(${ang} ${mx} ${my})" fill="${col}" stroke="#fff" stroke-width="${opt.pill ? 0 : 3 * px}" paint-order="stroke" font-weight="700">${esc(txt)}</text>`;
  return s;
}

// 設備的俯視圖示（區域座標，中心為 0,0；+y 那側是「正面」：門、旋鈕、人站的那邊）
function symSVG(it, col) {
  const w = it.w, d = it.d, hw = w / 2, hd = d / 2, m = Math.max(2, Math.min(7, w * .1, d * .1));
  const ns = NS;
  const R = (x, y, ww, hh, a = '') => `<rect x="${x}" y="${y}" width="${Math.max(0, ww)}" height="${Math.max(0, hh)}" ${a}/>`;
  const C = (x, y, r, a = '') => `<circle cx="${x}" cy="${y}" r="${Math.max(0, r)}" ${a}/>`;
  const Ln = (a, b, c, e, x = '') => `<line x1="${a}" y1="${b}" x2="${c}" y2="${e}" ${x}/>`;
  const thin = `stroke="${col}" stroke-width=".8" ${ns}`;
  const knobs = (n, y = hd - Math.min(5, d * .08)) => { // 正面的旋鈕
    let s = ''; const r = Math.min(3.2, w / (n * 5), d * .06);
    for (let i = 0; i < n; i++) s += C(-hw + w * (i + .5) / n, y, r, `fill="#1A1A16"`);
    return s;
  };
  // 爐架：深色圓盤＋環＋爐架十字
  const grate = (x, y, r) => C(x, y, r, `fill="#2f2f2b"`) + C(x, y, r * .62, `fill="none" stroke="#8a8a82" stroke-width="1" ${ns}`) + C(x, y, r * .22, `fill="#E0483E" fill-opacity=".8"`) +
    Ln(x - r * .92, y, x + r * .92, y, `stroke="#6a6a62" stroke-width="1" ${ns}`) + Ln(x, y - r * .92, x, y + r * .92, `stroke="#6a6a62" stroke-width="1" ${ns}`);
  const burners = (cols, rows) => {
    let s = ''; const top = d - Math.min(10, d * .14); // 留正面給旋鈕
    const cw = w / cols, rh = top / rows, r = Math.min(cw, rh) * .36;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) s += grate(-hw + cw * (i + .5), -hd + rh * (j + .5), r);
    return s + knobs(cols * Math.min(rows, 2));
  };
  // 水槽：水藍槽體＋排水孔＋背面的龍頭
  const basins = n => {
    let s = ''; const g = m, bw = (w - g * (n + 1)) / n, top = -hd + g + Math.min(8, d * .12), bh = hd - g - top;
    for (let i = 0; i < n; i++) {
      const x = -hw + g + i * (bw + g), cx = x + bw / 2;
      s += R(x, top, bw, bh, `rx="${Math.min(6, bw * .15)}" fill="url(#gWater)" stroke="${col}" stroke-width="1" ${ns}`) +
        C(cx, top + bh / 2, Math.min(bw, bh) * .07, `fill="#fff" stroke="${col}" stroke-width=".8" ${ns}`) +
        C(cx, -hd + g * .9, Math.min(3, g * .6), `fill="#8a8a82"`) + Ln(cx, -hd + g * .9, cx, top + Math.min(8, bh * .2), `stroke="#8a8a82" stroke-width="1.6" ${ns}`);
    }
    return s;
  };
  switch (it.sym) {
    case 'x1': { // 冰箱、冷凍櫃：門片＋把手＋雪花
      const n = Math.max(1, Math.round(w / 62)), pw = (w - 4) / n;
      let s = '';
      for (let i = 0; i < n; i++) {
        const x = -hw + 2 + i * pw;
        s += R(x + 1, -hd + 3, pw - 2, d - 6, `rx="2" fill="#fff" fill-opacity=".75" stroke="${col}" stroke-width=".8" ${ns}`);
        s += R(x + pw / 2 - Math.min(9, pw * .2), hd - 7, Math.min(18, pw * .4), 2.6, `rx="1.3" fill="${col}"`); // 把手
      }
      const r = Math.min(w, d) * .14, cy = -hd + d * .42;
      for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; s += Ln(-Math.cos(a) * r, cy - Math.sin(a) * r, Math.cos(a) * r, cy + Math.sin(a) * r, `stroke="${col}" stroke-width="1.2" stroke-linecap="round" ${ns}`); }
      return s;
    }
    case 'x': // 烤箱、微波爐、封口機等機器：面板＋旋鈕
      return R(-hw + m, -hd + m, w - 2 * m, d - 2 * m - Math.min(8, d * .12), `rx="3" fill="#fff" fill-opacity=".6" stroke="${col}" stroke-width=".8" ${ns}`) +
        R(-hw + m + 3, -hd + m + 3, (w - 2 * m) * .6, (d - 2 * m) * .5, `rx="2" fill="#2f2f2b" fill-opacity=".75"`) + knobs(2);
    case 'bin': return R(-hw + 3, -hd + 3, w - 6, d - 6, `rx="${Math.min(w, d) * .2}" fill="#fff" fill-opacity=".5" stroke="${col}" stroke-width=".8" ${ns}`) +
      R(-w * .15, -hd + 5, w * .3, 3, `rx="1.5" fill="${col}"`);
    case 'bin2': return R(-hw + 3, -hd + 3, w / 2 - 4, d - 6, `rx="6" fill="#fff" fill-opacity=".5" stroke="${col}" stroke-width=".8" ${ns}`) +
      R(1, -hd + 3, w / 2 - 4, d - 6, `rx="6" fill="#fff" fill-opacity=".5" stroke="${col}" stroke-width=".8" ${ns}`);
    case 'sink1': return basins(1);
    case 'sink2': return basins(2);
    case 'sink3': return basins(3);
    case 'b1': return burners(1, 1);
    case 'b2': return w >= d ? burners(2, 1) : burners(1, 2);
    case 'b4': return burners(2, 2);
    case 'b6': return w >= d ? burners(3, 2) : burners(2, 3);
    case 'grill': { // 煎台：深色鐵板＋油槽＋旋鈕
      const top = d - Math.min(12, d * .16);
      let s = R(-hw + m, -hd + m, w - 2 * m, top - m * 1.4, `rx="2" fill="#3a3a35"`);
      for (let i = 1; i < 5; i++) s += Ln(-hw + m + (w - 2 * m) * i / 5, -hd + m + 2, -hw + m + (w - 2 * m) * i / 5, -hd + top - m * 1.4 - 2, `stroke="#5a5a52" stroke-width=".8" ${ns}`);
      return s + knobs(Math.max(2, Math.round(w / 30)));
    }
    case 'fry': { // 炸爐：兩個油槽＋炸籃把手
      const top = d - Math.min(12, d * .18), bw = (w - 3 * m) / 2;
      let s = '';
      for (const x of [-hw + m, -hw + 2 * m + bw]) {
        s += R(x, -hd + m, bw, top - m, `rx="2" fill="#E8B84A" fill-opacity=".55" stroke="${col}" stroke-width=".8" ${ns}`);
        for (let j = 1; j < 4; j++) s += Ln(x + 2, -hd + m + (top - m) * j / 4, x + bw - 2, -hd + m + (top - m) * j / 4, `stroke="#9c7a20" stroke-width=".6" ${ns}`);
        s += Ln(x + bw / 2, -hd + top, x + bw / 2, hd - 3, `stroke="#1A1A16" stroke-width="2" stroke-linecap="round" ${ns}`);
      }
      return s;
    }
    case 'dish': { // 洗碗機：碗籃格子
      let s = R(-hw + m, -hd + m, w - 2 * m, d - 2 * m, `rx="3" fill="#fff" fill-opacity=".5" ${thin}`);
      for (let i = 1; i < 5; i++) s += Ln(-hw + m + (w - 2 * m) * i / 5, -hd + m, -hw + m + (w - 2 * m) * i / 5, hd - m, thin) + Ln(-hw + m, -hd + m + (d - 2 * m) * i / 5, hw - m, -hd + m + (d - 2 * m) * i / 5, thin);
      return s;
    }
    case 'shelf': { // 層架：隔板＋上面擺的箱子
      let s = Ln(-hw + 2, 0, hw - 2, 0, thin);
      const n = Math.max(2, Math.round(w / 35)), bw = (w - 6) / n;
      for (let i = 0; i < n; i++) s += R(-hw + 3 + i * bw + 2, -hd + 4, bw - 4, d / 2 - 7, `rx="1.5" fill="${col}" fill-opacity=".22" ${thin}`);
      return s;
    }
    case 'pos': // 收銀：螢幕＋錢櫃
      return R(-w * .16, -hd + m, w * .32, Math.min(10, d * .22), `rx="2" fill="#2f2f2b"`) +
        R(-w * .2, -hd + m + Math.min(10, d * .22) + 3, w * .4, d * .3, `rx="2" fill="#fff" stroke="${col}" stroke-width=".8" ${ns}`);
    case 'chair': // 椅子：坐墊＋椅背（椅背在後方）
      return R(-hw + 4, -hd + 9, w - 8, d - 13, `rx="${Math.min(w, d) * .18}" fill="url(#gWood)" stroke="${col}" stroke-width="1" ${ns}`) +
        R(-hw + 3, -hd + 2, w - 6, 6, `rx="3" fill="${col}" fill-opacity=".7"`);
    case 'sofa': {
      let s = R(-hw + 2, -hd + 2, w - 4, Math.min(16, d * .3), `rx="5" fill="${col}" fill-opacity=".55"`);
      const n = Math.max(1, Math.round(w / 55)), cw = (w - 8) / n, y0 = -hd + Math.min(16, d * .3) + 3;
      for (let i = 0; i < n; i++) s += R(-hw + 4 + i * cw + 1, y0, cw - 2, hd - y0 - 3, `rx="5" fill="url(#gWood)" stroke="${col}" stroke-width=".8" ${ns}`);
      return s;
    }
    case 'stair': { let s = ''; for (let y = -hd + 25; y < hd; y += 25) s += Ln(-hw, y, hw, y, thin); s += Ln(0, hd - 10, 0, -hd + 15, `stroke="${col}" stroke-width="1.2" ${ns}`) + `<path d="M${-8} ${-hd + 28} L0 ${-hd + 12} L8 ${-hd + 28}" fill="none" stroke="${col}" stroke-width="1.2" ${ns}/>`; return s; }
    case 'col': return '';
    case 'wc': return R(-16, -hd + 5, 32, 13, `rx="3" fill="#fff" stroke="${col}" stroke-width="1" ${ns}`) +
      `<ellipse cx="0" cy="${-hd + 42}" rx="17" ry="23" fill="#fff" stroke="${col}" stroke-width="1" ${ns}/><ellipse cx="0" cy="${-hd + 44}" rx="10" ry="15" fill="url(#gWater)" stroke="${col}" stroke-width=".8" ${ns}/>`;
    case 'hood': return Ln(-hw, -hd, hw, hd, `stroke="${col}" stroke-width="1" stroke-dasharray="6 4" ${ns}`) + Ln(hw, -hd, -hw, hd, `stroke="${col}" stroke-width="1" stroke-dasharray="6 4" ${ns}`);
    case 'trench': { let s = ''; for (let x = -hw + 6; x < hw; x += 6) s += Ln(x, -hd + 3, x, hd - 3, `stroke="#56656E" stroke-width="1" ${ns}`); return s; }
  }
  // 'none'：工作台、桌面、櫃台 → 檯面內框（座位類是木頭桌面）
  if (it.round) return `<ellipse cx="0" cy="0" rx="${Math.max(0, hw - 5)}" ry="${Math.max(0, hd - 5)}" fill="none" ${thin} stroke-opacity=".5"/>`;
  return R(-hw + 4, -hd + 4, w - 8, d - 8, `rx="2" fill="none" ${thin} stroke-opacity=".45"`);
}

// 每個分類的底色（不鏽鋼用金屬漸層、座位用木頭色）
const CAT_FILL = { cold: '#E6F1FC', prep: 'url(#gSteel)', hot: 'url(#gSteel)', bar: '#F3EAF8', front: '#FFF1DE', seat: 'url(#gWood)', store: '#F4ECE5', struct: '#ECEFF1', custom: '#F1F1EA' };

function equipSVG(it, warnIds) {
  const col = colorOf(it), bad = warnIds.has(it.id);
  const tf = `translate(${it.cx} ${it.cy}) rotate(${it.rot || 0})`;
  const strokeCol = bad ? '#E0483E' : col, sw = bad ? 2.4 : 1.6;
  const fill = it.color ? it.color : (CAT_FILL[it.cat] || '#F1F1EA');
  const fo = it.color ? ' fill-opacity=".16"' : '';
  const sh = it.over || it.floor ? '' : ' filter="url(#fSh)"';
  const rx = Math.min(4, it.w * .06, it.d * .06);
  let body;
  if (it.round) body = `<ellipse cx="0" cy="0" rx="${it.w / 2}" ry="${it.d / 2}" fill="${fill}"${fo} stroke="${strokeCol}" stroke-width="${sw}" ${NS}${sh}/>`;
  else if (it.over) body = `<rect x="${-it.w / 2}" y="${-it.d / 2}" width="${it.w}" height="${it.d}" fill="${col}" fill-opacity=".04" stroke="${strokeCol}" stroke-width="${sw}" stroke-dasharray="8 5" ${NS}/>`;
  else if (it.sym === 'col') body = `<rect x="${-it.w / 2}" y="${-it.d / 2}" width="${it.w}" height="${it.d}" fill="url(#pHatch)" stroke="${strokeCol}" stroke-width="${sw}" ${NS}/>`;
  else body = `<rect x="${-it.w / 2}" y="${-it.d / 2}" width="${it.w}" height="${it.d}" rx="${rx}" fill="${it.floor ? '#ECEFF1' : fill}"${fo} stroke="${strokeCol}" stroke-width="${sw}" ${NS}${sh}/>`;
  return `<g data-id="${it.id}" transform="${tf}" style="cursor:move">${body}${symSVG(it, col)}</g>`;
}

function openSVG(it, t) {
  const w = it.w, h = w / 2, col = OPEN_COLOR;
  const st = `stroke="${col}" fill="none" stroke-width="1.3" ${NS}`;
  let s = `<rect x="${-h}" y="${-t - 1}" width="${w}" height="${t + 2}" fill="#fff"/>`;
  // 牆的斷面端線
  s += `<line x1="${-h}" y1="${-t}" x2="${-h}" y2="0" stroke="#D86A2C" stroke-width="1.4" ${NS}/><line x1="${h}" y1="${-t}" x2="${h}" y2="0" stroke="#D86A2C" stroke-width="1.4" ${NS}/>`;
  const sgn = it.out ? -1 : 1, by = it.out ? -t : 0;
  const leaf = (hx, len, dir) => { // hx 鉸鍊位置；dir 門關上時往哪邊（+1 往右）
    const C = [hx, by], P1 = [hx, by + sgn * len], P2 = [hx + dir * len, by];
    const a1 = Math.atan2(P1[1] - C[1], P1[0] - C[0]), a2 = Math.atan2(P2[1] - C[1], P2[0] - C[0]);
    let df = a2 - a1; while (df > Math.PI) df -= 2 * Math.PI; while (df <= -Math.PI) df += 2 * Math.PI;
    return `<line x1="${C[0]}" y1="${C[1]}" x2="${P1[0]}" y2="${P1[1]}" stroke="${col}" stroke-width="2" ${NS}/>` +
      `<path d="M${P1[0]} ${P1[1]} A${len} ${len} 0 0 ${df > 0 ? 1 : 0} ${P2[0]} ${P2[1]}" ${st} stroke-dasharray="4 3"/>`;
  };
  switch (it.ot) {
    case 'door': s += it.flip ? leaf(h, w, -1) : leaf(-h, w, 1); break;
    case 'door2': s += leaf(-h, h, 1) + leaf(h, h, -1); break;
    case 'slide': s += `<rect x="${-h}" y="${-t * .72}" width="${w * .55}" height="${t * .22}" ${st}/><rect x="${h - w * .55}" y="${-t * .5}" width="${w * .55}" height="${t * .22}" ${st}/>`; break;
    case 'window': s += `<rect x="${-h}" y="${-t}" width="${w}" height="${t}" ${st}/><line x1="${-h}" y1="${-t / 2}" x2="${h}" y2="${-t / 2}" ${st}/>`; break;
    case 'shutter': s += `<line x1="${-h}" y1="${-t / 2}" x2="${h}" y2="${-t / 2}" stroke="${col}" stroke-width="2.4" stroke-dasharray="10 5" ${NS}/>`; break;
  }
  return `<g data-id="${it.id}" transform="translate(${it.cx} ${it.cy}) rotate(${it.rot || 0})" style="cursor:move"><rect x="${-h}" y="${-t - 4}" width="${w}" height="${t + 8}" fill="transparent"/>${s}</g>`;
}

function markSVG(it) {
  const m = MARKS.find(x => x[0] === it.mk) || MARKS[0], col = m[3], r = it.w / 2;
  const fs = m[2].length > 1 ? r * .78 : r * 1.1;
  return `<g data-id="${it.id}" transform="translate(${it.cx} ${it.cy})" style="cursor:move">
    <circle r="${r}" fill="#fff" stroke="${col}" stroke-width="1.8" ${NS}/>
    <text font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="${col}" font-weight="800">${m[2]}</text></g>`;
}

function textSVG(it) {
  return `<g data-id="${it.id}" transform="translate(${it.cx} ${it.cy}) rotate(${it.rot || 0})" style="cursor:move">
    <rect x="${-it.w / 2}" y="${-it.d / 2}" width="${it.w}" height="${it.d}" fill="transparent"/>
    <text font-size="${it.fs}" text-anchor="middle" dominant-baseline="central" fill="${it.color || '#1A1A16'}" font-weight="800">${esc(it.text)}</text></g>`;
}

// 設備名稱：一律正著放，字級跟著設備大小縮
function labelSVG(it) {
  const B = aabb(it), bw = B.r - B.l, bh = B.b - B.t, cx = (B.l + B.r) / 2, cy = (B.t + B.b) / 2;
  const size = it.round ? `Ø${fmt(it.w)}` : `${fmt(it.w)}×${fmt(it.d)}`;
  const lines = [it.name];
  if (S.set.sizes) lines.push(size);
  // 名稱做成白色小標籤：字不要大到蓋掉設備圖示
  let fs = Math.min(10.5, (bw - 10) / textW(it.name, 1), (bh - 6) / (lines.length * 1.25 + .5));
  if (lines.length === 2 && fs < 6) { lines.pop(); fs = Math.min(10.5, (bw - 10) / textW(it.name, 1), (bh - 6) / 1.75); }
  if (it.over) { // 上方設備：小字貼在框的下緣
    const f = Math.min(10, (bw - 4) / textW(it.name, 1));
    return f < 4 ? '' : `<text x="${cx}" y="${B.b - f * .9}" font-size="${f}" text-anchor="middle" dominant-baseline="central" fill="#8a8a82" font-weight="700" stroke="#fff" stroke-width="${f * .25}" paint-order="stroke">${esc(it.name)}（${size}）</text>`;
  }
  if (fs < 4.5) return '';
  const tw = Math.max(textW(lines[0], fs), lines[1] ? textW(lines[1], fs * .82) : 0) + fs * .9;
  const th = fs * 1.25 * lines.length + fs * .35;
  let s = `<rect x="${cx - tw / 2}" y="${cy - th / 2}" width="${tw}" height="${th}" rx="${fs * .45}" fill="#fff" fill-opacity=".88" stroke="${colorOf(it)}" stroke-opacity=".35" stroke-width=".8" ${NS}/>`;
  lines.forEach((t, i) => {
    const y = cy + (i - (lines.length - 1) / 2) * fs * 1.25;
    const f = i === 0 ? fs : fs * .82;
    s += `<text x="${cx}" y="${y}" font-size="${f}" text-anchor="middle" dominant-baseline="central" fill="${i ? '#6a6a62' : '#1A1A16'}" font-weight="${i ? 500 : 700}">${esc(t)}</text>`;
  });
  return s;
}

/* 整張圖：ui = { s: 每公分幾 px, k: 字與線的放大倍數, screen: 是否為畫面（有格線、選取框）} */
function sceneSVG(ui, opt = {}) {
  const g = G, px = ui.k / ui.s;
  const warnIds = new Set();
  if (opt.warn) WARNS.forEach(w => { if (w.type !== 'aisle') w.ids.forEach(i => warnIds.add(i)); });
  let s = '';
  // 格線
  if (ui.screen && S.set.grid) {
    const r = $('#svg').getBoundingClientRect();
    const x0 = -V.ox / V.s, y0 = -V.oy / V.s, ww = r.width / V.s, hh = r.height / V.s;
    s += `<rect x="${x0}" y="${y0}" width="${ww}" height="${hh}" fill="url(#pGrid)" pointer-events="none"/><rect x="${x0}" y="${y0}" width="${ww}" height="${hh}" fill="url(#pGrid2)" pointer-events="none"/>`;
  }
  const drawing = ui.screen && MODE === 'wall';
  if (g.ok) {
    const poly = P => P.map(p => p.join(',')).join(' ');
    s += drawing ? '<g opacity=".25">' : '<g>';   // 正在畫新牆時，舊的牆淡掉
    s += `<polygon points="${poly(g.pts)}" fill="#fff"/>`;
    if (g.t > 0) s += `<path d="M${g.outer.map(p => p.join(' ')).join('L')}Z M${g.pts.map(p => p.join(' ')).join('L')}Z" fill="url(#pWall)" fill-rule="evenodd" stroke="#D86A2C" stroke-width="1.4" ${NS}/>`;
    else s += `<polygon points="${poly(g.pts)}" fill="none" stroke="#D86A2C" stroke-width="2" ${NS}/>`;
    s += '</g>';
  }
  const items = S.items;
  // 地面層（排水溝）→ 設備 → 上方設備（排煙罩）→ 門窗 → 孔位 → 文字
  for (const it of items) if (isEquip(it) && it.floor) s += equipSVG(it, warnIds);
  for (const it of items) if (isEquip(it) && !it.floor && !it.over) s += equipSVG(it, warnIds);
  for (const it of items) if (isEquip(it) && it.over) s += equipSVG(it, warnIds);
  for (const it of items) if (it.t === 'open') s += openSVG(it, g.t || 10);
  if (S.set.labels) { s += '<g pointer-events="none">'; for (const it of items) if (isEquip(it)) s += labelSVG(it); s += '</g>'; }
  for (const it of items) if (it.t === 'mark') s += markSVG(it);
  for (const it of items) if (it.t === 'text') s += textSVG(it);
  // 自己量的尺寸
  for (const it of items) if (it.t === 'dim') {
    const sel = ui.screen && SEL.includes(it.id);
    s += `<g data-id="${it.id}" style="cursor:move"><line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="transparent" stroke-width="${12 * px}"/>${dimSVG(it.x1, it.y1, it.x2, it.y2, 0, fmt(Math.hypot(it.x2 - it.x1, it.y2 - it.y1)), sel ? '#7FA000' : '#1E7FD8', ui, { w: sel ? 2 : 1.2, fs: 12 })}</g>`;
  }
  // 牆面尺寸（室內淨尺寸）
  if (g.ok && !drawing) {
    const off = g.t + 24 * px, canEdit = ui.screen && MODE === 'select' && !VIEWONLY;
    for (const e of g.edges) {
      const sg = (-e.uy * e.nx + e.ux * e.ny) > 0 ? 1 : -1;
      const d = dimSVG(e.a[0], e.a[1], e.b[0], e.b[1], sg * off, fmt(e.len), '#2E7D32', ui, { fs: 12, pill: canEdit });
      s += canEdit ? `<g data-wall="${e.i}" style="cursor:pointer"><title>點一下改這面牆的長度</title>${d}</g>` : d;
    }
    // 不是矩形時，多標一組總寬總深
    if (g.pts.length > 4) {
      const xs = g.pts.map(p => p[0]), ys = g.pts.map(p => p[1]);
      const l = Math.min(...xs), r = Math.max(...xs), t = Math.min(...ys), b = Math.max(...ys), o2 = g.t + 52 * px;
      s += dimSVG(l, t, r, t, -o2, '總寬 ' + fmt(r - l), '#2E7D32', ui, { fs: 12 });
      s += dimSVG(l, b, l, t, -o2, '總深 ' + fmt(b - t), '#2E7D32', ui, { fs: 12 });
    }
  }
  // 牆角角度：畫面上在「空間」分頁才顯示（可點），輸出圖看選項
  if (g.ok && !drawing) {
    if (ui.screen) { if (MODE === 'select' && TAB === 'room' && !VIEWONLY) s += anglesSVG(ui, true); }
    else if (opt.angles) s += anglesSVG(ui, false);
  }
  // 走道警示
  if (opt.warn) for (const w of WARNS) if (w.type === 'aisle') s += dimSVG(w.p1[0], w.p1[1], w.p2[0], w.p2[1], 0, `走道 ${fmt(w.gap)}`, '#E0483E', ui, { w: 2, dash: 1, fs: 11 });

  if (ui.screen) {
    // 選到單一設備：標出離牆／離設備的距離
    if (S.set.dims && SEL.length === 1) { const it = byId(SEL[0]); if (it && (isEquip(it) || it.t === 'text' || it.t === 'mark')) s += clearSVG(it, ui); }
    // 選取框與把手
    for (const id of SEL) { const it = byId(id); if (it && it.t !== 'dim') s += selSVG(it, ui, SEL.length === 1); }
    // 吸附參考線：綠色虛線連到對齊的牆或設備，被對齊的設備亮綠框
    const px0 = 1 / V.s;
    GUIDES.forEach((gd, k) => {
      const ext = 14 * px0;
      if (gd.x != null) s += `<line x1="${gd.x}" y1="${gd.y1 - ext}" x2="${gd.x}" y2="${gd.y2 + ext}" stroke="#7FA000" stroke-width="1.6" stroke-dasharray="6 4" ${NS} pointer-events="none"/>`;
      if (gd.y != null) s += `<line x1="${gd.x1 - ext}" y1="${gd.y}" x2="${gd.x2 + ext}" y2="${gd.y}" stroke="#7FA000" stroke-width="1.6" stroke-dasharray="6 4" ${NS} pointer-events="none"/>`;
      if (gd.id) { const o = byId(gd.id); if (o) { const B = aabb(o); s += `<rect x="${B.l - 2 * px0}" y="${B.t - 2 * px0}" width="${B.r - B.l + 4 * px0}" height="${B.b - B.t + 4 * px0}" fill="#C3F000" fill-opacity=".12" stroke="#7FA000" stroke-width="2" ${NS} pointer-events="none"/>`; } }
      if (gd.label && gd.at) s += pill(gd.at[0] + 10 * px0 + textW(gd.label, 13 * px0) / 2 + 8 * px0, gd.at[1] + (k ? 16 : -16) * px0, gd.label, { k: 1, s: V.s }, '#fff', '#7FA000');
    });
    // 牆角把手（在「空間」分頁時才出現）：拖圓點改形狀、拖 ＋ 多一個轉角
    if (MODE === 'select' && TAB === 'room' && !VIEWONLY && S.room.pts && S.room.pts.length >= 3) {
      const P = S.room.pts, r = 7 * px;
      P.forEach((a, i) => {
        const b = P[(i + 1) % P.length], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        if (Math.hypot(b[0] - a[0], b[1] - a[1]) * V.s > 50)
          s += `<g data-vm="${i}" style="cursor:copy"><title>拖拉這裡，多加一個轉角</title><circle cx="${mx}" cy="${my}" r="${r * .85}" fill="#fff" stroke="#D86A2C" stroke-width="1.4" ${NS}/><path d="M${mx - r * .45} ${my}H${mx + r * .45}M${mx} ${my - r * .45}V${my + r * .45}" stroke="#D86A2C" stroke-width="1.6" ${NS}/></g>`;
      });
      P.forEach((a, i) => s += `<circle data-v="${i}" cx="${a[0]}" cy="${a[1]}" r="${r}" fill="#D86A2C" stroke="#fff" stroke-width="2" ${NS} style="cursor:move"><title>拖拉牆角改形狀（雙擊刪掉這個角）</title></circle>`);
    }
    // 拉線畫牆的預覽
    if (drawing) s += wallPreviewSVG(ui);
    // 量尺寸預覽
    if (MODE === 'dim') {
      if (DIMA && DIMP) s += dimSVG(DIMA[0], DIMA[1], DIMP[0], DIMP[1], 0, fmt(Math.hypot(DIMP[0] - DIMA[0], DIMP[1] - DIMA[1])), '#E07B00', ui, { w: 1.6, fs: 12 });
      for (const p of [DIMA, DIMP]) if (p) s += `<circle cx="${p[0]}" cy="${p[1]}" r="${4 * px}" fill="#E07B00" pointer-events="none"/>`;
    }
  }
  return s;
}

function selSVG(it, ui, handles) {
  const px = ui.k / ui.s, hw = it.w / 2 + 3 * px, hd = it.d / 2 + 3 * px;
  let s = `<g transform="translate(${it.cx} ${it.cy}) rotate(${it.t === 'mark' ? 0 : it.rot || 0})" pointer-events="none">`;
  if (it.t === 'mark') s += `<circle r="${it.w / 2 + 4 * px}" fill="none" stroke="#7FA000" stroke-width="2" stroke-dasharray="5 3" ${NS}/>`;
  else s += `<rect x="${-hw}" y="${-hd}" width="${hw * 2}" height="${hd * 2}" fill="none" stroke="#7FA000" stroke-width="2" stroke-dasharray="5 3" ${NS}/>`;
  s += '</g>';
  if (handles && isEquip(it)) {
    const a = (it.rot || 0) * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);
    const at = (x, y) => [it.cx + x * c - y * sn, it.cy + x * sn + y * c];
    const r = 7 * px, rr = at(0, -hd - 22 * px), top = at(0, -hd);
    s += `<line x1="${top[0]}" y1="${top[1]}" x2="${rr[0]}" y2="${rr[1]}" stroke="#7FA000" stroke-width="1.4" ${NS} pointer-events="none"/>`;
    s += `<circle data-h="rot" cx="${rr[0]}" cy="${rr[1]}" r="${r}" fill="#C3F000" stroke="#1A1A16" stroke-width="1.4" ${NS} style="cursor:grab"><title>拖拉旋轉（按住 Shift 可自由角度）</title></circle>`;
    const hwH = at(it.w / 2, 0), hdH = at(0, it.d / 2);
    s += `<rect data-h="rw" x="${hwH[0] - r}" y="${hwH[1] - r}" width="${r * 2}" height="${r * 2}" rx="${2 * px}" fill="#fff" stroke="#1A1A16" stroke-width="1.4" ${NS} style="cursor:ew-resize"><title>拖拉改寬度</title></rect>`;
    if (!it.round) s += `<rect data-h="rd" x="${hdH[0] - r}" y="${hdH[1] - r}" width="${r * 2}" height="${r * 2}" rx="${2 * px}" fill="#fff" stroke="#1A1A16" stroke-width="1.4" ${NS} style="cursor:ns-resize"><title>拖拉改深度</title></rect>`;
  }
  return s;
}

// 選到的設備往上下左右找最近的牆或設備，標出距離
function clearSVG(it, ui) {
  if (!G.ok) return '';
  const A = aabb(it), cx = (A.l + A.r) / 2, cy = (A.t + A.b) / 2;
  const others = S.items.filter(o => o.id !== it.id && isSolid(o)).map(aabb);
  const res = { l: Infinity, r: Infinity, t: Infinity, b: Infinity };
  for (const B of others) {
    if (B.b > A.t + .5 && B.t < A.b - .5) { if (B.r <= A.l + .5) res.l = Math.min(res.l, A.l - B.r); if (B.l >= A.r - .5) res.r = Math.min(res.r, B.l - A.r); }
    if (B.r > A.l + .5 && B.l < A.r - .5) { if (B.b <= A.t + .5) res.t = Math.min(res.t, A.t - B.b); if (B.t >= A.b - .5) res.b = Math.min(res.b, B.t - A.b); }
  }
  for (const e of G.edges) {
    const [x1, y1] = e.a, [x2, y2] = e.b;
    if ((y1 - cy) * (y2 - cy) <= 0 && Math.abs(y2 - y1) > 1e-6) {
      const x = x1 + (cy - y1) * (x2 - x1) / (y2 - y1);
      if (x <= A.l + .5) res.l = Math.min(res.l, A.l - x); if (x >= A.r - .5) res.r = Math.min(res.r, x - A.r);
    }
    if ((x1 - cx) * (x2 - cx) <= 0 && Math.abs(x2 - x1) > 1e-6) {
      const y = y1 + (cx - x1) * (y2 - y1) / (x2 - x1);
      if (y <= A.t + .5) res.t = Math.min(res.t, A.t - y); if (y >= A.b - .5) res.b = Math.min(res.b, y - A.b);
    }
  }
  const col = '#E07B00';
  let s = '<g pointer-events="none">';
  if (isFinite(res.l) && res.l > .5) s += dimSVG(A.l - res.l, cy, A.l, cy, 0, fmt(res.l), col, ui, { dash: 1, fs: 12 });
  if (isFinite(res.r) && res.r > .5) s += dimSVG(A.r, cy, A.r + res.r, cy, 0, fmt(res.r), col, ui, { dash: 1, fs: 12 });
  if (isFinite(res.t) && res.t > .5) s += dimSVG(cx, A.t - res.t, cx, A.t, 0, fmt(res.t), col, ui, { dash: 1, fs: 12 });
  if (isFinite(res.b) && res.b > .5) s += dimSVG(cx, A.b, cx, A.b + res.b, 0, fmt(res.b), col, ui, { dash: 1, fs: 12 });
  return s + '</g>';
}

/* ================= 畫面更新 ================= */
const svg = $('#svg'), world = $('#world');
$('#defs').innerHTML = defsSVG();

function render() {
  G = roomGeo();
  runChecks();
  world.setAttribute('transform', `translate(${V.ox} ${V.oy}) scale(${V.s})`);
  world.innerHTML = sceneSVG({ s: V.s, k: 1, screen: true }, { warn: S.set.aisle });
  $('#zoomLbl').textContent = Math.round(V.s * 100) + '%';
  renderStatus();
  renderWarns();
  renderList();
  $('#bUndo').disabled = !UNDO.length; $('#bRedo').disabled = !REDO.length;
  for (const [id, k] of [['tGrid', 'grid'], ['tSnap', 'snap'], ['tDims', 'dims'], ['tAisle', 'aisle']]) $('#' + id).classList.toggle('on', !!S.set[k]);
}
// 畫牆時目前這一筆的長度、傾斜角、和上一面牆的夾角
function wallLive() {
  if (MODE !== 'wall' || !WD || !WP.length) return null;
  const a = WP[WP.length - 1], L = Math.hypot(WD[0] - a[0], WD[1] - a[1]); if (L < .5) return null;
  let tilt = -Math.atan2(WD[1] - a[1], WD[0] - a[0]) * 180 / Math.PI; // 數學習慣：往右 0°、往上 90°
  tilt = ((tilt % 360) + 360) % 360;
  let between = null;
  if (WP.length >= 2) {
    const p = WP[WP.length - 2], ux = p[0] - a[0], uy = p[1] - a[1], vx = WD[0] - a[0], vy = WD[1] - a[1];
    between = Math.acos(clamp((ux * vx + uy * vy) / Math.hypot(ux, uy) / L, -1, 1)) * 180 / Math.PI;
  }
  return { L, tilt, between };
}
function renderStatus() {
  const wl = wallLive();
  if (wl && !VIEWONLY) {
    // 傾斜改成白話：水平／垂直，或「↗ 斜 30°」（跟水平線差幾度）
    const t = wl.tilt, h = Math.round(Math.min(t % 180, 180 - t % 180) * 10) / 10;
    const arrow = ['→', '↗', '↑', '↖', '←', '↙', '↓', '↘'][Math.round(t / 45) % 8];
    const tiltTxt = h < .05 ? `${arrow} 水平` : Math.abs(h - 90) < .05 ? `${arrow} 垂直` : `${arrow} 斜 ${fmt(h)}°`;
    $('#status').innerHTML = `✏️ 這面牆 長 <b>${fmt(wl.L)}</b> 公分　｜　方向 <b>${tiltTxt}</b>${wl.between != null ? `　｜　和上一面牆夾角 <b>${fmt(Math.round(wl.between * 10) / 10)}°</b>` : ''}　｜　按住 Shift 可自由角度`;
    return;
  }
  const c = CURSOR ? `游標 x <b>${fmt(CURSOR[0])}</b>　y <b>${fmt(CURSOR[1])}</b> 公分` : '單位：公分';
  const n = S.items.filter(isEquip).length;
  $('#status').innerHTML = VIEWONLY ? `設備 ${n} 件　｜　兩指縮放、拖曳移動` : `${c}　｜　設備 ${n} 件　｜　拖空白處移動畫面、滾輪縮放`;
}

/* ================= 視圖：縮放平移 ================= */
function contentBounds() {
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  const add = (x, y) => { l = Math.min(l, x); r = Math.max(r, x); t = Math.min(t, y); b = Math.max(b, y); };
  if (G && G.ok) G.outer.concat(G.pts).forEach(p => add(p[0], p[1]));
  for (const it of S.items) { const B = aabb(it); add(B.l, B.t); add(B.r, B.b); }
  if (!isFinite(l)) { l = 0; t = 0; r = 600; b = 400; }
  return { l, t, r, b };
}
function fitView() {
  G = roomGeo();
  const B = contentBounds(), rc = svg.getBoundingClientRect();
  if (!rc.width) return;
  const pad = 70;
  V.s = clamp(Math.min((rc.width - pad * 2) / (B.r - B.l || 1), (rc.height - pad * 2) / (B.b - B.t || 1)), .05, 8);
  V.ox = rc.width / 2 - (B.l + B.r) / 2 * V.s;
  V.oy = rc.height / 2 - (B.t + B.b) / 2 * V.s;
  render();
}
function zoomAt(f, sx, sy) {
  const ns = clamp(V.s * f, .05, 8);
  V.ox = sx - (sx - V.ox) * ns / V.s; V.oy = sy - (sy - V.oy) * ns / V.s; V.s = ns;
  render();
}
function toWorld(e) { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left - V.ox) / V.s, (e.clientY - r.top - V.oy) / V.s]; }
function viewCenter() { const r = svg.getBoundingClientRect(); return [(r.width / 2 - V.ox) / V.s, (r.height / 2 - V.oy) / V.s]; }

/* ================= 復原／重做 ================= */
const snap = () => JSON.stringify({ meta: S.meta, room: S.room, items: S.items, custom: S.custom });
function restore(str) { const o = JSON.parse(str); Object.assign(S, o); SEL = SEL.filter(id => byId(id)); }
function commit(fn, opt = {}) {
  const pre = snap(); fn();
  if (snap() !== pre) { UNDO.push(pre); if (UNDO.length > 120) UNDO.shift(); REDO = []; DIRTY = true; }
  refresh(opt);
}
function refresh(opt = {}) { render(); renderProps(); if (opt.room) renderRoom(); if (opt.lib) renderLib(); }
function undo() { if (!UNDO.length) return; REDO.push(snap()); restore(UNDO.pop()); refresh({ room: 1, lib: 1 }); }
function redo() { if (!REDO.length) return; UNDO.push(snap()); restore(REDO.pop()); refresh({ room: 1, lib: 1 }); }

/* ================= 新增物件 ================= */
function placeNew(it) {
  const c = viewCenter();
  let cx = c[0], cy = c[1];
  if (G && G.ok) { // 畫面中心不在店裡就放到店中間
    if (!inPoly([cx, cy], G.pts)) { const B = contentBounds(); cx = (B.l + B.r) / 2; cy = (B.t + B.b) / 2; }
  }
  // 跟現有物件錯開一點，避免疊在一起看不出來
  let n = 0; while (n < 12 && S.items.some(o => o.t === it.t && Math.abs(o.cx - cx) < 1 && Math.abs(o.cy - cy) < 1)) { cx += 15; cy += 15; n++; }
  it.cx = Math.round(cx); it.cy = Math.round(cy);
  if (it.t === 'open') snapToWall(it, cx, cy);
  commit(() => S.items.push(it));
  SEL = [it.id]; MODE = 'select'; setMode('select');
  refresh();
  if (window.matchMedia('(max-width:1099px)').matches) { /* 平板：留在原分頁，屬性在第 4 頁 */ }
}
function addLib(i) {
  const [cat, name, w, d, sym, ex = {}] = LIB[i];
  placeNew({ id: uid(), t: 'equip', cat, name, w, d, sym, rot: 0, note: '', ...(ex.round ? { round: 1 } : {}), ...(ex.over ? { over: 1 } : {}), ...(ex.floor ? { floor: 1 } : {}) });
}
function addCustom(c) { placeNew({ id: uid(), t: 'equip', cat: c.cat || 'custom', name: c.name, w: c.w, d: c.d, sym: c.sym || 'none', rot: 0, note: '', ...(c.round ? { round: 1 } : {}), ...(c.color ? { color: c.color } : {}) }); }
function addOpen(i) { const [ot, name, w] = OPENS[i]; placeNew({ id: uid(), t: 'open', ot, name, w, d: 15, rot: 0, flip: 0, out: 0 }); }
function addMark(i) { const [mk, name] = MARKS[i]; placeNew({ id: uid(), t: 'mark', mk, name, w: 22, d: 22, rot: 0, note: '' }); }
function addText() { const it = { id: uid(), t: 'text', text: '文字', fs: 24, rot: 0 }; sizeText(it); placeNew(it); }
function sizeText(it) { it.w = Math.max(20, textW(it.text || ' ', it.fs) + 6); it.d = it.fs * 1.4; }

/* ================= 拖拉與吸附 ================= */
function unionBox(ids) {
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  for (const id of ids) { const B = aabb(byId(id)); l = Math.min(l, B.l); t = Math.min(t, B.t); r = Math.max(r, B.r); b = Math.max(b, B.b); }
  return { l, t, r, b };
}
function snapDelta(box, dx, dy, ids, noMag) {
  GUIDES = [];
  const tol = 10 / V.s;
  let bx = null, by = null;
  if (S.set.snap && !noMag) {
    // 參考目標：牆面（水平／垂直的牆）、其他設備的邊與中線；lo/hi 是那個東西的範圍，用來畫虛線
    const xs = [], ys = [];
    if (G.ok) for (const e of G.edges) {
      if (Math.abs(e.ux) < 1e-6) xs.push({ v: e.a[0], lo: Math.min(e.a[1], e.b[1]), hi: Math.max(e.a[1], e.b[1]), name: '牆面', wall: 1 });
      if (Math.abs(e.uy) < 1e-6) ys.push({ v: e.a[1], lo: Math.min(e.a[0], e.b[0]), hi: Math.max(e.a[0], e.b[0]), name: '牆面', wall: 1 });
    }
    for (const o of S.items) if (!ids.includes(o.id) && isEquip(o)) {
      const B = aabb(o);
      xs.push({ v: B.l, lo: B.t, hi: B.b, name: o.name, id: o.id }, { v: B.r, lo: B.t, hi: B.b, name: o.name, id: o.id }, { v: (B.l + B.r) / 2, lo: B.t, hi: B.b, name: o.name, id: o.id, mid: 1 });
      ys.push({ v: B.t, lo: B.l, hi: B.r, name: o.name, id: o.id }, { v: B.b, lo: B.l, hi: B.r, name: o.name, id: o.id }, { v: (B.t + B.b) / 2, lo: B.l, hi: B.r, name: o.name, id: o.id, mid: 1 });
    }
    const mx = [box.l + dx, box.r + dx, (box.l + box.r) / 2 + dx], my = [box.t + dy, box.b + dy, (box.t + box.b) / 2 + dy];
    const pick = (tg, mv) => { let best = null;
      for (const t of tg) mv.forEach((e, k) => {
        if ((k === 2) !== !!t.mid) return;             // 中線只跟中線對齊，邊跟邊對齊
        const d = t.v - e; if (Math.abs(d) < tol && (!best || Math.abs(d) < Math.abs(best.d) - .01)) best = { d, t, mid: k === 2 };
      });
      return best; };
    bx = pick(xs, mx); by = pick(ys, my);
  }
  dx = bx ? dx + bx.d : Math.round(box.l + dx) - box.l;
  dy = by ? dy + by.d : Math.round(box.t + dy) - box.t;
  // 虛線範圍：從對齊的東西一路連到正在拖的設備
  const nb = { l: box.l + dx, r: box.r + dx, t: box.t + dy, b: box.b + dy };
  if (bx) GUIDES.push({ x: bx.t.v, y1: Math.min(bx.t.lo, nb.t), y2: Math.max(bx.t.hi, nb.b), id: bx.t.id, label: (bx.mid ? '中線對齊 ' : '靠齊 ') + bx.t.name, at: [nb.r, nb.t] });
  if (by) GUIDES.push({ y: by.t.v, x1: Math.min(by.t.lo, nb.l), x2: Math.max(by.t.hi, nb.r), id: by.t.id, label: (by.mid ? '中線對齊 ' : '靠齊 ') + by.t.name, at: [nb.r, nb.b] });
  return [dx, dy];
}
// 量尺寸時的吸附點：牆角、設備角
function snapPoint(p) {
  const tol = 12 / V.s; let best = null;
  const tryP = q => { const d = Math.hypot(q[0] - p[0], q[1] - p[1]); if (d < tol && (!best || d < best.d)) best = { d, q }; };
  if (G.ok) G.pts.forEach(tryP);
  for (const it of S.items) if (isEquip(it)) corners(it).forEach(tryP);
  return best ? best.q.map(r1) : [Math.round(p[0]), Math.round(p[1])];
}

/* ================= 拉線畫牆 ================= */
function startWall() {
  WP = []; WD = null; SEL = [];
  setMode('wall'); renderProps();
}
// 算出拉到哪裡：接近水平／垂直／45 度就自動拉直，靠近起點就自動接回去
function wallEnd(p, free) {
  WSNAP = null;
  if (!WP.length) return [Math.round(p[0] / 5) * 5, Math.round(p[1] / 5) * 5];
  const a = WP[WP.length - 1], f = WP[0];
  if (WP.length >= 3 && Math.hypot(p[0] - f[0], p[1] - f[1]) < 16 / V.s) return [f[0], f[1]];
  let dx = p[0] - a[0], dy = p[1] - a[1], L = Math.hypot(dx, dy);
  if (L < 1) return [a[0], a[1]];
  let ang = Math.atan2(dy, dx) * 180 / Math.PI;
  if (!free) {
    const near = Math.round(ang / 45) * 45;
    if (Math.abs(ang - near) < 9) ang = near;
    L = Math.round(L / 5) * 5;  // 拉線時每 5 公分一跳，之後再點數字改精準
  }
  const rad = ang * Math.PI / 180;
  let q = [a[0] + Math.cos(rad) * L, a[1] + Math.sin(rad) * L];
  // 對齊前面的牆角：沿著目前方向滑動，找「x 或 y 跟某個舊牆角一樣」的位置，夠近就吸過去
  if (!free) {

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || VIEWONLY) return;
  if (document.querySelector('.mask')) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); SEL = S.items.map(i => i.id); refresh(); return; }
  if (MODE === 'wall') { // 畫牆時：Esc 取消、Backspace 退一步、Enter 完成
    if (e.key === 'Escape') cancelWall();
    else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); WP.pop(); setMode('wall', true); }
    else if (e.key === 'Enter') finishWall();
    return;
  }
  if (e.key === 'Escape') { if (MODE === 'dim') setMode('select'); SEL = []; refresh(); return; }
  if (e.key === 'm' || e.key === 'M') { setMode(MODE === 'dim' ? 'select' : 'dim'); return; }
  if (!SEL.length) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); return; }
  if (e.key === 'r' || e.key === 'R') { rotateSel(e.shiftKey ? -90 : 90); return; }
  const step = e.shiftKey ? 10 : 1;
  const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (mv) { e.preventDefault(); commit(() => SEL.forEach(id => moveBy(byId(id), mv[0], mv[1]))); }
});
function moveBy(it, dx, dy) {
  if (it.t === 'dim') { it.x1 += dx; it.y1 += dy; it.x2 += dx; it.y2 += dy; }
  else if (it.t === 'open') snapToWall(it, it.cx + dx, it.cy + dy);
  else { it.cx = r1(it.cx + dx); it.cy = r1(it.cy + dy); }
}
function deleteSel() { const ids = SEL.slice(); SEL = []; commit(() => { S.items = S.items.filter(i => !ids.includes(i.id)); }); }
function rotateSel(deg) { commit(() => SEL.forEach(id => { const it = byId(id); if (it && (isEquip(it) || it.t === 'text')) it.rot = (((it.rot || 0) + deg) % 360 + 360) % 360; })); }
function duplicateSel() {
  if (!SEL.length) return;
  const news = SEL.map(id => { const c = JSON.parse(JSON.stringify(byId(id))); c.id = uid(); moveBy(c, 20, 20); return c; });
  commit(() => S.items.push(...news)); SEL = news.map(n => n.id); refresh();
}

function boundsW() { const g = roomGeo(); if (!g.ok) return 600; const xs = g.pts.map(p => p[0]); return Math.max(...xs) - Math.min(...xs); }
function boundsD() { const g = roomGeo(); if (!g.ok) return 400; const ys = g.pts.map(p => p[1]); return Math.max(...ys) - Math.min(...ys); }
// 存牆角：去掉重複點與同一直線上多餘的點
function setRoomFromPts(pts) {
  let P = pts.map(p => [r1(p[0]), r1(p[1])]);
  if (P.length > 1 && Math.hypot(P[0][0] - P[P.length - 1][0], P[0][1] - P[P.length - 1][1]) < .5) P.pop();
  for (let k = 0; k < 3 && P.length > 3; k++) {
    P = P.filter((b, i) => {
      const a = P[(i - 1 + P.length) % P.length], c = P[(i + 1) % P.length];
      if (Math.hypot(b[0] - a[0], b[1] - a[1]) < .5) return false;
      const cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      return Math.abs(cr) > 1e-3 * Math.hypot(b[0] - a[0], b[1] - a[1]) * Math.hypot(c[0] - b[0], c[1] - b[1]);
    });
  }
  S.room = { t: S.room.t ?? 15, pts: P };
}
// 改第 i 面牆的長度：把「下一面牆」整面平移過去（像把那面牆推出去／拉進來），矩形改完還是矩形
function setWallLen(i, L) {
  const P = S.room.pts, n = P.length;
  if (n < 3 || L <= 0) return false;
  const a = P[i], b = P[(i + 1) % n], cur = Math.hypot(b[0] - a[0], b[1] - a[1]); if (!cur) return false;
  const dx = (b[0] - a[0]) / cur * (L - cur), dy = (b[1] - a[1]) / cur * (L - cur);
  for (const j of [(i + 1) % n, (i + 2) % n]) if (j !== i) P[j] = [r1(P[j][0] + dx), r1(P[j][1] + dy)];
  return true;
}
function rectNotch(W, D, a, b, c) {
  const C = { TL: [[0, b], [a, b], [a, 0]], TR: [[W - a, 0], [W - a, b], [W, b]], BR: [[W, D - b], [W - a, D - b], [W - a, D]], BL: [[a, D], [a, D - b], [0, D - b]] };
  const base = { TL: [[0, 0]], TR: [[W, 0]], BR: [[W, D]], BL: [[0, D]] };
  const pts = [];
  for (const k of ['TL', 'TR', 'BR', 'BL']) pts.push(...(k === c ? C[k] : base[k]));
  return pts;
}
function reSnapOpens() { G = roomGeo(); for (const it of S.items) if (it.t === 'open') snapToWall(it, it.cx, it.cy); }

          <div class="fld"><label>顏色</label><input class="inp" type="color" data-f="color" value="${colorOf(it)}" style="height:32px;padding:2px"></div>
        </div>

        <p class="hint" style="margin-bottom:8px">拖<b>綠色圓點</b>旋轉、拖<b>白色方塊</b>改大小。鍵盤方向鍵微調 1 公分（加 Shift 是 10 公分）。</p>
